# Group Sync Operator Helm Chart Values
# This file contains the default configuration values for the Group Sync Operator Helm Chart

# -------------------- Naming --------------------
# Base name used by the "...fullname" helper. Without this, fullname concatenates
# the release name with the (longer) chart name — e.g. release "group-sync" +
# chart "group-sync-operator-helm" => "group-sync-group-sync-operator-helm-..."
# (Helm's dedup guard only fires when the release name CONTAINS the chart name,
# which never happens here since the chart name is longer). Pinning fullnameOverride
# keeps the oauth-secret-extraction ClusterRole/ClusterRoleBinding/Job names short
# and stable: "group-sync-operator-oauth-secret-extraction".
fullnameOverride: group-sync-operator

# -------------------- Namespace --------------------
# OFF by default. Use `--create-namespace` for helm; ArgoCD's Application sets CreateNamespace=true.
#
# Enabling it fails whenever the namespace already exists (Helm refuses to adopt it) and whenever
# --create-namespace is passed (Helm creates it, then this tries to create it again). It is here for
# a GitOps tool that applies the rendered manifest into a cluster where the namespace is absent.
namespace:
  create: false

# -------------------- GroupSync CR Configuration --------------------
# Controls the main GroupSync custom resource configuration
groupSync:
  # Enable or disable the GroupSync CR creation (set to false for initial operator installation)
  enabled: true
  # Name of the GroupSync resource
  name: ldap-groupsync
  # Namespace where the GroupSync CR will be created
  namespace: group-sync-operator
  # Schedule in cron format (every 30 minutes)
  schedule: "*/30 * * * *"
  # Name of the LDAP provider in the GroupSync configuration
  providerName: ldap

  # CA Certificate configuration
  ca:
    # Name of the ConfigMap containing the CA certificate
    name: ca-config-map-test
    # Key within the ConfigMap that contains the certificate
    key: ca.crt
    # Namespace where the ConfigMap is located
    namespace: openshift-config

  # LDAP authentication credentials configuration
  credentialsSecret:
    # Name of the Secret containing LDAP credentials
    name: ldap-group-sync
    # Namespace where the Secret is located
    namespace: group-sync-operator

  # LDAP server URL (ldap:// for insecure, ldaps:// for secure connections)
  url: "ldap://openldap-service.ldap-testing.svc.cluster.local:389"
  # Set to true for plain LDAP, false for LDAPS with certificates
  insecure: true

  # RFC2307 schema configuration
  rfc2307:
    # Users query configuration
    usersQuery:
      # Base DN for searching users
      baseDN: "dc=ephico2real,dc=com"
      # Additional query parameters
      derefAliases: "never"
      pageSize: 0
      scope: "sub"
      timeout: 0

    # Groups query configuration
    groupsQuery:
      # Base DN for searching groups
      baseDN: "ou=Groups,dc=ephico2real,dc=com"
      # Filter for groups - only sync OpenShift RBAC groups (excludes general-users)
      filter: "(&(objectClass=groupOfNames)(cn=app-ocp-rbac-*))"
      # Additional query parameters
      derefAliases: "never"
      pageSize: 0
      scope: "sub"
      timeout: 0

    # LDAP attribute mappings for groups
    groupNameAttributes:
      - cn
    groupUIDAttribute: dn
    groupMembershipAttributes:
      - member

    # LDAP attribute mappings for users
    userNameAttributes:
      - uid
    userUIDAttribute: dn

    # Error tolerance settings
    tolerateMemberNotFoundErrors: true
    tolerateMemberOutOfScopeErrors: true

# -------------------- Custom (multi-tenant) GroupSync CRs --------------------
# Generate ONE additional GroupSync CR per team/tenant. Full guide:
# docs/DESIGN_custom_groupsync.md
#
# Rule: one naming pattern = one CR. Each item needs only a unique name and the
# group pattern (groupCn). The chart fills in the rest so it is mistake-proof:
#   - the LDAP filter is built for you: cn=<groupCn> -> (&(objectClass=groupOfNames)(cn=<groupCn>))
#   - the provider name is always "ldap"
#   - the connection (url/credentials/ca/usersQuery) is inherited from groupSync above
#
# Patterns must never overlap between tenants; that is guaranteed by the org
# naming standard (enforced by Kyverno later), NOT by this chart.
customGroupSyncs:
  # Master switch for ALL custom CRs.
  enabled: true
  items:
    # Big-Data Analytics: syncs every cn=bda-rbac-* group.
    - name: bda-rbac-groupsync
      enabled: true
      groupCn: "bda-rbac-*"
      # Hourly, rather than inheriting the 30-minute primary schedule. Written as
      # "0 * * * *" not "*/60 * * * *" — the minute field only spans 0-59, so */60 is
      # non-idiomatic and rejected by some cron parsers.
      schedule: "0 * * * *"

    # Example second tenant (left disabled — enable once its groups exist in LDAP):
    # - name: xyz-ocp-rbac-groupsync
    #   enabled: true
    #   groupCn: "xyz-ocp-rbac-*"
    #
    # Optional per-item overrides (rarely needed):
    #   schedule: "*/5 * * * *"     # override the inherited sync schedule
    #   namespace: some-namespace   # override where the CR is created
    #   filter: "(&(objectClass=groupOfNames)(cn=foo-*)(cn=bar-*))"  # raw LDAP filter (advanced)

# -------------------- Operator Subscription Configuration --------------------
# Controls how the operator is installed via OLM
subscription:
  # OLM channel to use (alpha, beta, stable)
  name: group-sync-operator
  channel: alpha
  # Comma-separated list of namespaces for the operator to watch
  watchNamespaces: group-sync-operator,openshift-config
  # Installation approval strategy (Automatic or Manual).
  #
  # MANUAL BY DEFAULT, and that is a deliberate choice with a cost. Manual is the upgrade gate:
  # OLM stages a new CSV and waits, instead of moving the operator under you the moment the
  # catalog publishes one. Automatic means an operator upgrade lands unannounced, on the
  # catalog's schedule rather than yours.
  #
  # The cost is that Manual also blocks the FIRST install — OLM stages an unapproved InstallPlan
  # and waits for a human. `installPlanApprover` below resolves that by approving the plan for
  # THIS subscription only, so an unattended install still works while a later upgrade still
  # waits for you.
  #
  # IF YOU SET installPlanApprover.enabled=false WITH Manual, expect the install to fail: nobody
  # approves the plan, so the operator never installs, and the operatorWait Job times out and
  # fails the release rather than reporting success over a cluster with no operator. That is the
  # correct outcome, but it is a failure, so approve by hand within operatorWait.waitSeconds if
  # you deliberately want that shape.
  installPlanApproval: Manual
  # Source catalog for the operator
  source: community-operators
  # Namespace where the catalog source is located
  sourceNamespace: openshift-marketplace

# -------------------- OAuth Secret Extraction Configuration --------------------
# Controls the Job that extracts password from OAuth LDAP secret and creates GroupSync secret
oauthSecretExtraction:
  # Enable or disable the OAuth secret extraction job
  enabled: true

  # Service account configuration for OAuth secret extraction
  serviceAccount:
    # Name of the service account to create and use
    name: oauth-secret-extractor

  # OpenShift CLI image for secret extraction
  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: v4.14
    pullPolicy: IfNotPresent

  # Source secret configuration (OAuth LDAP secret)
  sourceSecret:
    name: ldap-secret
    namespace: openshift-config
    passwordKey: bindPassword

  # Target secret configuration (GroupSync secret)
  targetSecret:
    name: ldap-group-sync
    namespace: group-sync-operator

  # LDAP bind DN for the GroupSync secret
  bindDN: "cn=ocp-ldap-bind-serviceid,ou=TrustedApplications,dc=ephico2real,dc=com"

  # Job configuration
  waitTimeout: 300  # seconds to wait for source secret
  backoffLimit: 3
  ttlSecondsAfterFinished: 300  # cleanup job after 5 minutes

  # Resource limits for the extraction job
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -------------------- InstallPlan approver --------------------
# Approves the InstallPlan for this subscription so Manual approval installs unattended, while
# later upgrades still wait for a human. Refuses any plan that does not name this subscription.
#
# Renders only for Manual; with Automatic, OLM approves its own plans.
installPlanApprover:
  enabled: true
  waitSeconds: 300
  # 0: retrying re-waits from zero and turns a 5-minute failure into a 30-minute one with the
  # same message at the end.
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: v4.14
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# -------------------- Operator readiness wait --------------------
# A Job that blocks the install until the operator can serve GroupSync: CSV Succeeded, Deployment
# ready, CRD Established.
#
# Without it an install can report success while nothing reconciles — Helm applies unknown kinds
# last by name, and "GroupSync" sorts before "Subscription", so a CR can be created before the
# operator is subscribed.
operatorWait:
  enabled: true

  # Applies to all three checks together (CSV Succeeded, Deployment available, CRD Established),
  # not per check. 300s covers a cold catalog pull on a slow cluster. A Manual
  # installPlanApproval with nobody to approve it will use the whole budget and then fail with
  # the command to run — which is the right outcome, since it genuinely is not installed.
  waitSeconds: 300

  # 0, not the default 6. Retrying a timeout re-waits from zero and turns a 5-minute failure into
  # a 30-minute one, with the same message at the end.
  backoffLimit: 0

  ttlSecondsAfterFinished: 300

  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: v4.14
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# -------------------- Test Configuration --------------------
# Controls settings for the Helm tests
test:
  # Enable or disable the test pods
  enabled: true

  # OpenShift CLI image configuration for operator health testing
  operatorHealthImage:
    # Image repository
    repository: "registry.redhat.io/openshift4/ose-cli"
    # Image tag
    tag: "latest"
    # Image pull policy
    pullPolicy: IfNotPresent

  # LDAP client image configuration for LDAP connection testing
  ldapClientImage:
    # Image repository
    repository: "quay.io/redhat-cop/group-sync-operator"
    # Image tag
    tag: "latest"
    # Image pull policy
    pullPolicy: IfNotPresent
