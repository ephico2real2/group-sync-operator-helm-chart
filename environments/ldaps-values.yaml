# LDAPS trusted through service-ca, with NO CA copy.
#
# The one shape that needs no copying: OpenShift injects openshift-service-ca.crt into every
# namespace, so the operator already has the signer in its own namespace. That makes this the
# simplest LDAPS configuration, and the one to reach for when the directory's certificate is issued
# by service-ca — which is what setup-local-ldap-testing/01-ldap-server.yaml does via the Service
# annotation.
#
# The base values instead copy the cluster's OAuth CA in, and ldaps-certmanager-values.yaml copies a
# cert-manager root. All three verify a chain; only this one has nothing to copy.
#
#   helm install group-sync . -n group-sync-operator --create-namespace \
#     -f environments/ldaps-values.yaml

groupSync:
  enabled: true
  name: ldap-groupsync
  namespace: group-sync-operator
  schedule: "*/30 * * * *"
  providerName: ldap

  # Must match a SAN on the server certificate. service-ca issues for <svc>.<ns>.svc and
  # <svc>.<ns>.svc.cluster.local, so either form works.
  url: "ldaps://openldap-service.ldap-testing.svc.cluster.local:636"
  # Verification on. Note the CA is required either way: an ldaps:// url needs the root regardless of
  # this flag, because insecure only relaxes checks the operator makes itself.
  insecure: false

  ca:
    # caSecret, not ca. Operator validation checks caSecret and fails every reconcile with
    # "caSecret must be specified when insecure=false" when only ca is set.
    field: caSecret
    # openshift-service-ca.crt is injected by OpenShift into EVERY namespace, so this needs no
    # cross-namespace read and no copying. It holds the service-serving-signer that signs any
    # certificate service-ca issues — which is how the LDAP server gets a certificate whose SAN is
    # its Service DNS name. Use ca-config-map in openshift-config instead when the LDAP server has
    # an enterprise certificate.
    kind: ConfigMap
    name: openshift-service-ca.crt
    namespace: group-sync-operator
    key: service-ca.crt

  credentialsSecret:
    name: ldap-group-sync
    namespace: group-sync-operator

  rfc2307:
    usersQuery:
      baseDN: "dc=ephico2real,dc=com"
      derefAliases: "never"
      pageSize: 0
      scope: "sub"
      timeout: 0
    groupsQuery:
      baseDN: "ou=Groups,dc=ephico2real,dc=com"
      filter: "(&(objectClass=groupOfNames)(cn=app-ocp-rbac-*))"
      derefAliases: "never"
      pageSize: 0
      scope: "sub"
      timeout: 0
    groupNameAttributes:
      - cn
    groupUIDAttribute: dn
    groupMembershipAttributes:
      - member
    userNameAttributes:
      - uid
    userUIDAttribute: dn
    tolerateMemberNotFoundErrors: true
    tolerateMemberOutOfScopeErrors: true

customGroupSyncs:
  enabled: true
  items:
    - name: bda-rbac-groupsync
      enabled: true
      groupCn: "bda-rbac-*"
      schedule: "0 * * * *"

oauthSecretExtraction:
  caCopy:
    # Off, and that is the point of this file. openshift-service-ca.crt is already in every namespace,
    # so there is nothing to copy — leaving it on would create a second, redundant ConfigMap that
    # groupSync.ca does not reference, and the job would warn about exactly that.
    enabled: false
