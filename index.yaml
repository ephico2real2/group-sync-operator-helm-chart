          description: "The InstallPlan approver is a namespaced Role instead of a ClusterRole. It granted patch on installplans in EVERY namespace - measured yes in default, kube-system and openshift-monitoring - and approving an InstallPlan installs an operator, so that was the broadest grant this chart held. All eight of its API calls are namespace-scoped, so nothing was lost. It also now grants clusterserviceversions get/list, without which csv_phase() returned empty on every call (measured: list clusterserviceversions -> no) leaving two diagnostic escape paths dead, and it no longer discards stderr, so a Forbidden stops looking like 'OLM staged nothing'."
