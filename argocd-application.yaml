apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: group-sync-operator
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift-requirement: "true"
    openshift-version: "4.x"
# TWO SOURCES, and both are required. The chart comes from the Helm repository; the values file comes from
# YOUR git repository, so per-cluster configuration is versioned with your config rather than baked into a
# published chart. Needs ArgoCD 2.6 or newer, which is where multiple sources landed.
#
# EDIT THE SECOND SOURCE BEFORE APPLYING THIS. The repoURL and the values path below are placeholders.
spec:
  project: default
  sources:
    - repoURL: https://ephico2real2.github.io/group-sync-operator-helm-chart
      chart: group-sync-operator-helm
      # A CHART VERSION, not a git ref. For a Helm source ArgoCD resolves targetRevision as a semver, so
      # `HEAD` — which this used to say — is meaningless here and pins nothing. `0.8.x` takes patches
      # automatically and holds the minor, so a behaviour change never arrives unannounced.
      targetRevision: 0.8.x
      helm:
        # The values file, from the second source. `$values` is only valid at the START of the path, and it
        # resolves relative to the root of the repo that carries `ref: values`.
        #
        # THAT FILE MUST SET groupSync.url EXPLICITLY. ArgoCD's repo-server renders with `helm template`,
        # offline, so the chart's `lookup`-based discovery of the url from the cluster's OAuth CR resolves to
        # nothing there — and every GroupSync CR the chart emits then hits a `fail`. This Application used to
        # point at the chart's own values.yaml, where url is "", so it could never render at all.
        valueFiles:
          - $values/clusters/prod/group-sync-values.yaml
        # A NO-OP AGAINST THIS CHART VERSION, KEPT DELIBERATELY. As of 0.13.0 the chart has no crds/
        # directory: the GroupSync CRD comes from the catalog via the Subscription, and OLM is its only
        # owner. skipCrds only ever governed crds/, so there is nothing left for it to skip.
        #
        # It stays because it is free and it is load-bearing in two cases this Application can reach
        # without anyone editing it: targetRevision below takes patches automatically, so a rollback to a
        # 0.12.x chart brings crds/ back, and ArgoCD renders Helm sources with
        # `helm template --include-crds` — which emits crds/ where a plain `helm template` does not.
        # Argo would then manage a CRD OLM already owns, and with prune + selfHeal below it can delete or
        # revert it. Deleting that CRD cascades to every GroupSync CR on the cluster.
        #
        # It does NOT cover crd.install=true. That renders an ordinary templated CustomResourceDefinition,
        # which skipCrds does not touch — by design, since it is the bootstrap escape hatch and its whole
        # purpose is to be applied. Leave crd.install false here; ArgoCD does not need it.
        skipCrds: true
    # Values only: `ref` makes this source referenceable as $values and contributes no manifests of its own.
    - repoURL: https://git.example.com/YOUR-ORG/YOUR-CONFIG-REPO.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: group-sync-operator
  # Required by RespectIgnoreDifferences below, which until now had nothing to respect. With
  # trustedCA.injected.enabled the chart ships this ConfigMap EMPTY and OpenShift's network operator fills
  # data.ca-bundle.crt — so Argo sees a permanent diff and, with selfHeal, empties it again on every sync,
  # breaking LDAPS verification until the operator refills it. ServerSideApply on the ConfigMap is not
  # sufficient alone; the chart says so at 01.4 and CA_CERTIFICATE_FLOW.md, and this is the other half.
  #
  # Harmless when trustedCA.injected is off: the ConfigMap simply does not exist.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: ldap-trusted-ca
      namespace: group-sync-operator
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

