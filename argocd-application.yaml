apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: group-sync-operator
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift-requirement: "true"
    openshift-version: "4.x"
spec:
  project: default
  source:
    repoURL: https://ephico2real2.github.io/group-sync-operator-helm-chart
    targetRevision: HEAD
    chart: group-sync-operator-helm
    helm:
      valueFiles:
        - values.yaml
      # ArgoCD renders Helm sources with `helm template --include-crds`, so the vendored
      # crds/groupsyncs.redhatcop.redhat.io.yaml IS part of this Application unless it is skipped.
      # Without this, Argo takes management of a CRD that OLM already owns through the Subscription and
      # CSV, and with prune + selfHeal below it can delete or revert it. crds/ exists only so a plain
      # `helm install` can resolve the GroupSync kind before rendering templates — see the README.
      #
      # Deleting that CRD cascades to every GroupSync CR, so leave this set.
      skipCrds: true
  destination:
    server: https://kubernetes.default.svc
    namespace: group-sync-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

