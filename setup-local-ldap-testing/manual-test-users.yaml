# manual-test-users.yaml — the OpenShift users that exist only because someone created them by hand.
#
# Measured 2026-09-18: the cluster holds 52 users whose identity provider is NOT in the OAuth configuration
# (`ceo_rnd_oim`, 49; `my-provider`, 2; one with no identity at all). They cannot be recreated by logging
# in, because there is nothing to log in to — they are User and Identity objects written directly, which is
# how a test population is made without standing up a provider for it. A rebuilt cluster has none of them,
# and nothing in any chart or script creates them.
#
# Apply with `oc apply -f manual-test-users.yaml`, then repair the back-reference, because an Identity's
# `user.uid` must match the User object the API server just assigned:
#
#   for u in $(oc get users -o name | sed 's#user.user.openshift.io/##'); do
#     uid=$(oc get user "$u" -o jsonpath='{.metadata.uid}')
#     for i in $(oc get identity -o json | jq -r --arg u "$u" '.items[]|select(.user.name==$u)|.metadata.name'); do
#       oc patch identity "$i" --type=merge -p "{\"user\":{\"name\":\"$u\",\"uid\":\"$uid\"}}"
#     done
#   done
#
# `test-python-user` is deliberately absent: it carries a bare UUID identity with no provider prefix, so
# there is nothing to reconstruct it from. Recreate it with whatever script made it, or drop it.

apiVersion: user.openshift.io/v1
kind: User
metadata:
  name: test-user-002
identities:
- ceo_rnd_oim:test-user-002
---
apiVersion: user.openshift.io/v1
kind: Identity
metadata:
  name: ceo_rnd_oim:test-user-002
providerName: ceo_rnd_oim
providerUserName: test-user-002
user:
  name: test-user-002
  uid: PLACEHOLDER
