# OpenLDAP Server Deployment
# Domain: ephico2real.com
# NOTE: Run 03-ldap-bootstrap-job.yaml FIRST before deploying this file

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap-config
  namespace: ldap-testing
  labels:
    app: openldap-server
data:
  # LDAP configuration environment variables
  LDAP_ORGANISATION: "Ephico Real"
  LDAP_DOMAIN: "ephico2real.com"
  LDAP_BASE_DN: "dc=ephico2real,dc=com"
  LDAP_ADMIN_PASSWORD: "admin123"
  LDAP_CONFIG_PASSWORD: "config123"
  LDAP_READONLY_USER: "false"
  LDAP_READONLY_USER_USERNAME: "readonly"
  LDAP_READONLY_USER_PASSWORD: "readonly123"
  LDAP_RFC2307BIS_SCHEMA: "false"
  LDAP_BACKEND: "mdb"
  LDAP_TLS: "true"
  LDAP_TLS_CRT_FILENAME: "ldap.crt"
  LDAP_TLS_KEY_FILENAME: "ldap.key"
  LDAP_TLS_DH_PARAM_FILENAME: "dhparam.pem"
  LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
  LDAP_TLS_ENFORCE: "false"
  LDAP_TLS_CIPHER_SUITE: "SECURE256:-VERS-SSL3.0"
  # never, not demand. The group-sync operator presents no client certificate, so demand makes
  # every LDAPS bind fail.
  LDAP_TLS_VERIFY_CLIENT: "never"
  LDAP_REPLICATION: "false"
  KEEP_EXISTING_CONFIG: "false"
  LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
  LDAP_SSL_HELPER_PREFIX: "ldap"
  # Configure ACLs to allow service account full read access
  LDAP_ACCESS_CONTROL: |
    access to attrs=userPassword
      by self write
      by dn="cn=admin,dc=ephico2real,dc=com" write
      by dn="cn=ocp-ldap-bind-serviceid,ou=TrustedApplications,dc=ephico2real,dc=com" read
      by anonymous auth
      by * none
    access to *
      by dn="cn=admin,dc=ephico2real,dc=com" write
      by dn="cn=ocp-ldap-bind-serviceid,ou=TrustedApplications,dc=ephico2real,dc=com" read
      by users read
      by * none

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap-server
  namespace: ldap-testing
  labels:
    app: openldap-server
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: the database is on a ReadWriteOnce PVC, and starting a
  # second pod before the first exits leaves slapd unable to open a locked database — it exits 1 and
  # the new pod CrashLoopBackOffs while the old one keeps serving.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openldap-server
  template:
    metadata:
      labels:
        app: openldap-server
    spec:
      serviceAccountName: openldap-server
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      # Installs the service-ca serving certificate so LDAPS presents a certificate whose SAN is the
      # Service DNS name. Without it osixia self-signs for the POD name, and any client verifying the
      # hostname fails with:
      #   x509: certificate is valid for openldap-server-<hash>, not openldap-service...svc.cluster.local
      #
      # Copied into the emptyDir rather than mounted over the certs directory, because osixia writes
      # dhparam.pem there and reads the key as uid 911.
      initContainers:
      - name: install-certs
        image: registry.redhat.io/openshift4/ose-cli:v4.14
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          install -m 0644 /tls/tls.crt        /certs/ldap.crt
          install -m 0644 /tls/tls.key        /certs/ldap.key
          install -m 0644 /ca/service-ca.crt  /certs/ca.crt
          ls -l /certs
        volumeMounts:
        - name: ldap-certs
          mountPath: /certs
        - name: serving-cert
          mountPath: /tls
          readOnly: true
        - name: service-ca
          mountPath: /ca
          readOnly: true
      containers:
      - name: openldap
        image: osixia/openldap:1.5.0
        ports:
        - containerPort: 389
          name: ldap
        - containerPort: 636
          name: ldaps
        env:
        - name: LDAP_LOG_LEVEL
          value: "256"
        envFrom:
        - configMapRef:
            name: ldap-config
        volumeMounts:
        - name: ldap-data
          mountPath: /var/lib/ldap
          subPath: ldap-db
        - name: ldap-data
          mountPath: /etc/ldap/slapd.d
          subPath: ldap-config
        - name: ldap-certs
          mountPath: /container/service/slapd/assets/certs
        - name: ldap-data
          mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom
          subPath: bootstrap/ldif/custom
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: ldap-data
        persistentVolumeClaim:
          claimName: ldap-data-pvc
      - name: ldap-config-vol
        emptyDir: {}
      # Writable: osixia generates dhparam.pem here at startup.
      - name: ldap-certs
        emptyDir: {}
      # Issued by service-ca because the Service carries
      # service.beta.openshift.io/serving-cert-secret-name.
      - name: serving-cert
        secret:
          secretName: openldap-serving-cert
      # Filled by service-ca because the ConfigMap carries
      # service.beta.openshift.io/inject-cabundle. Same signer, so the certificate verifies.
      - name: service-ca
        configMap:
          name: openldap-service-ca

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-service-ca
  namespace: ldap-testing
  # Ships EMPTY on purpose: service-ca writes service-ca.crt into it. That key is the
  # service-serving-signer, which is also what signs the serving certificate below, so a client
  # trusting it verifies the LDAPS endpoint.
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: openldap-service
  namespace: ldap-testing
  labels:
    app: openldap-server
  annotations:
    # service-ca issues a certificate into this Secret with SANs openldap-service.ldap-testing.svc
    # and openldap-service.ldap-testing.svc.cluster.local, and rotates it. The initContainer above
    # installs it as osixia's ldap.crt/ldap.key.
    service.beta.openshift.io/serving-cert-secret-name: openldap-serving-cert
spec:
  selector:
    app: openldap-server
  ports:
  - name: ldap
    port: 389
    targetPort: 389
    protocol: TCP
  - name: ldaps
    port: 636
    targetPort: 636
    protocol: TCP
  type: ClusterIP

---
# Optional: Route for external access (OpenShift)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ldap-route
  namespace: ldap-testing
  labels:
    app: openldap-server
spec:
  to:
    kind: Service
    name: openldap-service
  port:
    targetPort: ldap
  wildcardPolicy: None

