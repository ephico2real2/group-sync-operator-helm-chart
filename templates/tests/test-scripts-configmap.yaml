{{- if .Values.test.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-test-scripts
  namespace: {{ .Values.groupSync.namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "0"
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
data:
  operator-health-test.sh: |
{{ .Files.Get "scripts/operator-health-test.sh" | indent 4 }}
  ldap-connection-test.sh: |
{{ .Files.Get "scripts/ldap-connection-test.sh" | indent 4 }}
{{- end }}

