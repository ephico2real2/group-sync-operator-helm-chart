# Optional. Helm writes its release secret into the target namespace BEFORE pre-install hooks run,
# so this cannot create the namespace for a first `helm install` — use --create-namespace. Under
# ArgoCD the Application's CreateNamespace=true sync option does the same job.
#
# Kept for GitOps tools that apply the rendered manifest without creating namespaces. Set
# namespace.create=false where the namespace is managed elsewhere; a create against a namespace
# still Terminating fails the whole install.
{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.groupSync.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: namespace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
{{- end }}
