{{- if .Values.trustedCA.injected.enabled }}
# Deliberately EMPTY. OpenShift's network operator fills in ca-bundle.crt because of the LABEL below —
# an annotation does not work — merging the system trust store with proxy/cluster.spec.trustedCA.
# Measured on a stock cluster: 148 certificates, 226KB.
#
# It therefore only carries CAs the CLUSTER already trusts. For the operator to verify an LDAP server
# this way, that server's CA must be in proxy/cluster.spec.trustedCA; otherwise the bundle is just
# public roots and verification fails with "certificate signed by unknown authority".
#
# Do not put data here: the network operator owns the contents and overwrites them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.trustedCA.injected.name }}
  namespace: {{ .Values.groupSync.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
  annotations:
    # Before the extraction Job (wave 2), whose preflight reads it.
    argocd.argoproj.io/sync-wave: "0"
    # The network operator writes data.ca-bundle.crt here; this ships empty. Server-side apply lets it
    # keep ownership of what it wrote instead of Argo reverting it on every sync, which would empty the
    # bundle and break verification until the operator refilled it. Ignored by plain helm.
    #
    # NOT sufficient alone: the Argo Application also needs an ignoreDifferences entry for this
    # ConfigMap's `data`, which cannot be set from here.
    argocd.argoproj.io/sync-options: ServerSideApply=true
{{- end }}
