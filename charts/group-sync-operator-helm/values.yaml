# Group Sync Operator Helm Chart Values
# This file contains the default configuration values for the Group Sync Operator Helm Chart

# -------------------- Naming --------------------
# Base name used by the "...fullname" helper. Without this, fullname concatenates
# the release name with the (longer) chart name — e.g. release "group-sync" +
# chart "group-sync-operator-helm" => "group-sync-group-sync-operator-helm-..."
# (Helm's dedup guard only fires when the release name CONTAINS the chart name,
# which never happens here since the chart name is longer). Pinning fullnameOverride
# keeps the oauth-secret-extraction ClusterRole/ClusterRoleBinding/Job names short
# and stable: "group-sync-operator-oauth-secret-extraction".
fullnameOverride: group-sync-operator

# -------------------- Namespace --------------------
# OFF by default. Use `--create-namespace` for helm; ArgoCD's Application sets CreateNamespace=true.
#
# Enabling it fails whenever the namespace already exists (Helm refuses to adopt it) and whenever
# --create-namespace is passed (Helm creates it, then this tries to create it again). It is here for
# a GitOps tool that applies the rendered manifest into a cluster where the namespace is absent.
namespace:
  create: false

# -------------------- GroupSync CR Configuration --------------------
# Controls the main GroupSync custom resource configuration
groupSync:
  # Enable or disable the GroupSync CR creation (set to false for initial operator installation)
  enabled: true
  # Name of the GroupSync resource
  name: ldap-groupsync
  # Namespace where the GroupSync CR will be created
  namespace: group-sync-operator
  # Schedule in cron format (every 30 minutes)
  schedule: "*/30 * * * *"
  # Name of the LDAP provider in the GroupSync configuration
  providerName: ldap

  # CA for LDAPS. Required whenever the url is ldaps://, even with insecure true — insecure relaxes
  # verification the operator does itself, it does not make a handshake trust an unknown root.
  #
  # This names the COPY that oauthSecretExtraction.caCopy writes into this namespace, not the source
  # in openshift-config. Referencing openshift-config directly needs cross-namespace ConfigMap read
  # that the operator has on some clusters and not others, and where it is denied the only symptom is
  # the operator reconciling forever on "ConfigMap ... not found, caSecret must be specified when
  # insecure=false" — which names neither the namespace nor the permission.
  ca:
    # caSecret or ca. The CRD has both and calls caSecret deprecated, but operator validation checks
    # caSecret — with only `ca` set it fails every reconcile with "caSecret must be specified when
    # insecure=false" even though the referenced resource exists. Switch to ca on a version that
    # honours it.
    field: caSecret
    # Must match oauthSecretExtraction.caCopy.destinationCa. Point this at openshift-config only if
    # you have confirmed the operator's ServiceAccount can read ConfigMaps there.
    kind: ConfigMap
    name: ca-config-map-copy
    key: ca.crt
    namespace: group-sync-operator

  # The Secret the OPERATOR reads its bind credentials from.
  #
  # Its keys must be `username` and `password` — those are what the operator looks for
  # (secretUsernameKey/secretPasswordKey in the group-sync-operator source), and it reads no others. The
  # CRD does not document this: credentialsSecret is described only as "a reference to a secret containing
  # authentication details for communicating to LDAP".
  #
  # A MISSING KEY IS NOT AN ERROR. The operator substitutes an empty string, so the wrong key names give
  # you an anonymous bind rather than a failure. A directory that refuses anonymous bind then reports
  # "unauthenticated bind disallowed", which reads like a directory problem rather than a Secret problem;
  # one that permits it binds successfully and sees nothing. Note that `prune: true` is set on every CR.
  #
  # DO NOT CONFUSE THIS WITH THE OAUTH SECRET. They are different objects, with different keys and
  # different owners:
  #
  #   this Secret                        keys username + password   written by the extraction Job below
  #   openshift-config/<sourceSecret>    key  bindPassword          NOT owned by this chart
  #
  # The OAuth one holds the bind password for the cluster's LDAP identity provider. On a real cluster it
  # already exists — placed there by whatever automation manages platform credentials, and predating this
  # chart. The chart only READS it: it is granted no write verb on it anywhere, so it cannot change it even
  # by mistake. How narrowly that read is scoped depends on sourceSecret.name below — set, it is pinned to
  # that one name; left empty (the default) the name is discovered from the OAuth CR at runtime, so no
  # resourceNames can cover it and the read spans Secrets in openshift-config. Read-only either way; name
  # the Secret explicitly if that is too broad for your cluster.
  #
  # Rotate it at the source and re-run the upgrade; see the rotation section in README.md. (The OAuth
  # provider's bind DN is a field on the OAuth CR, not a Secret key at all — there is no `bindDN` key in
  # this design.)
  #
  # With oauthSecretExtraction.enabled below, this Secret is machine-managed: the Job rewrites it on every
  # install and upgrade, so hand-editing it is pointless. With extraction disabled it is yours to create,
  # with those two keys.
  credentialsSecret:
    name: ldap-group-sync
    namespace: group-sync-operator

  # EMPTY on purpose: set it in the per-cluster values file, or leave it out and let it be derived
  # from the cluster OAuth CR's first LDAP identity provider. Only scheme://host:port is taken — the
  # basedn and query in an OAuth LDAP url describe authentication, not group sync. An explicit value
  # always wins, so this cannot silently repoint an existing install.
  #
  # CAUTION — deriving needs a LIVE cluster. It uses `lookup`, which works for helm install and
  # upgrade but returns nothing for `helm template`, `--dry-run`, and offline GitOps renders such as
  # ArgoCD. The render FAILS there rather than emitting a GroupSync with no url, so set this
  # explicitly if you use any of them.
  #
  # Changing the host or port after groups exist needs care either way: the operator compares
  # openshift.io/ldap.url on each Group against host:port and refuses to adopt a mismatch
  # ("annotation did not match sync host"). Deleting the operator-managed groups is enough — the next
  # sync recreates them:
  #   oc delete groups -l group-sync-operator.redhat-cop.io/sync-provider
  #
  # The local test directory value, for reference:
  #   url: "ldaps://openldap-service.ldap-testing.svc.cluster.local:636"
  url: ""

  # false, so the operator verifies the chain, and a CA is therefore required. Note that a CA is
  # required for any ldaps:// url regardless of this flag: insecure relaxes checks the operator makes
  # itself, it cannot make a TLS handshake trust an unknown root.
  #
  # Setting this true AND leaving url empty is the one combination to avoid: needsCa is evaluated on
  # the url as written, so an empty url with insecure true emits no CA — and if the derived url turns
  # out to be ldaps://, the operator will have no root to verify against.
  insecure: false

  # RFC2307 schema configuration
  rfc2307:
    # Users query configuration
    usersQuery:
      # Base DN for searching users
      baseDN: "dc=ephico2real,dc=com"
      # Additional query parameters
      derefAliases: "never"
      pageSize: 0
      scope: "sub"
      timeout: 0

    # Groups query configuration
    groupsQuery:
      # Base DN for searching groups
      baseDN: "ou=Groups,dc=ephico2real,dc=com"
      # Filter for groups - only sync OpenShift RBAC groups (excludes general-users)
      filter: "(&(objectClass=groupOfNames)(cn=app-ocp-rbac-*))"
      # Additional query parameters
      derefAliases: "never"
      pageSize: 0
      scope: "sub"
      timeout: 0

    # LDAP attribute mappings for groups
    groupNameAttributes:
      - cn
    groupUIDAttribute: dn
    groupMembershipAttributes:
      - member

    # LDAP attribute mappings for users
    userNameAttributes:
      - uid
    userUIDAttribute: dn

    # Error tolerance settings
    tolerateMemberNotFoundErrors: true
    tolerateMemberOutOfScopeErrors: true

# -------------------- Trusted CA injection --------------------
# THIRD way to give the operator a CA, alongside the copy and a ConfigMap you supply. All three end at
# the same place: whatever groupSync.ca names. See CA_CERTIFICATE_FLOW.md.
#
#   1. copy      oauthSecretExtraction.caCopy.enabled=true  — the Job copies sourceCa to destinationCa
#   2. injected  trustedCA.injected.enabled=true            — OpenShift fills an empty ConfigMap
#   3. existing  both of the above false                     — point groupSync.ca at your own ConfigMap
#
# Creates an EMPTY ConfigMap labelled config.openshift.io/inject-trusted-cabundle: "true", which
# OpenShift's network operator fills with the system trust store merged with
# proxy/cluster.spec.trustedCA. Nothing to maintain and no copy step.
#
# THE LIMIT, and it decides whether this is any use to you: the bundle carries only CAs the CLUSTER
# already trusts. An LDAP server signed by a corporate CA that is in proxy/cluster.spec.trustedCA works
# with no further setup. One signed by anything else — a lab signer, a local cert-manager root — does
# NOT, because an empty proxy.spec.trustedCA yields nothing but public roots. Check before enabling:
#
#   oc get proxy cluster -o jsonpath='{.spec.trustedCA.name}{"\n"}'
#
# When enabled, set caCopy.enabled=false and point groupSync.ca at it — the key is ca-bundle.crt, fixed
# by the injector, not ca.crt:
#
#   groupSync:
#     ca:
#       kind: ConfigMap
#       name: ldap-trusted-ca
#       namespace: group-sync-operator
#       key: ca-bundle.crt
trustedCA:
  injected:
    # Off by default: on a cluster with an empty proxy.spec.trustedCA it produces a bundle that cannot
    # verify anything the public roots do not already cover.
    enabled: false
    # The ConfigMap the chart creates, empty, in groupSync.namespace.
    name: ldap-trusted-ca

# -------------------- Custom (multi-tenant) GroupSync CRs --------------------
# Generate ONE additional GroupSync CR per team/tenant. Full guide:
# docs/DESIGN_custom_groupsync.md
#
# Rule: one naming pattern = one CR. Each item needs only a unique name and the
# group pattern (groupCn). The chart fills in the rest so it is mistake-proof:
#   - the LDAP filter is built for you: cn=<groupCn> -> (&(objectClass=groupOfNames)(cn=<groupCn>))
#   - the provider name is always "ldap"
#   - the connection (url/credentials/ca/usersQuery) is inherited from groupSync above
#
# Patterns must never overlap between tenants; that is guaranteed by the org
# naming standard (enforced by Kyverno later), NOT by this chart.
customGroupSyncs:
  # Master switch for ALL custom CRs.
  enabled: true
  # SHIPPED EMPTY on purpose. This list used to carry an enabled bda-rbac-groupsync item, so a default
  # install created a SECOND GroupSync CR nobody had asked for — on the reference cluster it owned 21 of the
  # 64 synced groups. Declare the tenants you want; the chart no longer decides for you.
  #
  # Upgrading from 0.9.0 or earlier: if you relied on that default, add the item back here or to your own
  # values file. Its CR disappears otherwise, and the groups it owned stop being refreshed — they are not
  # deleted (prune runs during a sync, and there is no longer a CR to sync) but they do go stale.
  items: []
    # Big-Data Analytics: syncs every cn=bda-rbac-* group.
    # - name: bda-rbac-groupsync
    #   enabled: true
    #   groupCn: "bda-rbac-*"
    #   # Hourly, rather than inheriting the 30-minute primary schedule. Written as
    #   # "0 * * * *" not "*/60 * * * *" — the minute field only spans 0-59, so */60 is
    #   # non-idiomatic and rejected by some cron parsers.
    #   schedule: "0 * * * *"

    # Example second tenant (left disabled — enable once its groups exist in LDAP):
    # - name: xyz-ocp-rbac-groupsync
    #   enabled: true
    #   groupCn: "xyz-ocp-rbac-*"
    #
    # Optional per-item overrides (rarely needed):
    #   schedule: "*/5 * * * *"     # override the inherited sync schedule
    #   namespace: some-namespace   # override where the CR is created
    #   filter: "(&(objectClass=groupOfNames)(cn=foo-*)(cn=bar-*))"  # raw LDAP filter (advanced)

# -------------------- Operator Subscription Configuration --------------------
# Controls how the operator is installed via OLM
subscription:
  # The OLM PACKAGE name, exactly as the catalog publishes it. Confirm it on your cluster with:
  #   oc get packagemanifest group-sync-operator -n openshift-marketplace
  #
  # NOT a free rename knob. This one value supplies BOTH the Subscription object's name and its
  # spec.name, on purpose, because they must not diverge: OLM names the ClusterServiceVersion
  # "<package>.v<version>" and the operator Deployment is named from the CSV, while the InstallPlan
  # approver and the operator-wait Job both match those using this value. Setting the object name away
  # from the package sent them hunting for a CSV that never exists — the wait Job burned its whole
  # budget reporting "no <name>.* CSV reached Succeeded" while the operator was perfectly healthy.
  #
  # Change it only if your catalog carries the package under a different name, which a mirrored or
  # disconnected catalog can. A name the catalog does not carry makes OLM report ResolutionFailed, which
  # the InstallPlan approver detects and explains rather than waiting out.
  name: group-sync-operator
  # OLM channel to use (alpha, beta, stable). The comment used to sit above `name`, describing the
  # wrong field.
  channel: alpha
  # Comma-separated list of namespaces for the operator to watch
  watchNamespaces: group-sync-operator,openshift-config
  # Installation approval strategy (Automatic or Manual).
  #
  # MANUAL BY DEFAULT, and that is a deliberate choice with a cost. Manual is the upgrade gate:
  # OLM stages a new CSV and waits, instead of moving the operator under you the moment the
  # catalog publishes one. Automatic means an operator upgrade lands unannounced, on the
  # catalog's schedule rather than yours.
  #
  # The cost is that Manual also blocks the FIRST install — OLM stages an unapproved InstallPlan
  # and waits for a human. `installPlanApprover` below resolves that by approving the plan for
  # THIS subscription only, so an unattended install still works while a later upgrade still
  # waits for you.
  #
  # IF YOU SET installPlanApprover.enabled=false WITH Manual, expect the install to fail: nobody
  # approves the plan, so the operator never installs, and the operatorWait Job times out and
  # fails the release rather than reporting success over a cluster with no operator. That is the
  # correct outcome, but it is a failure, so approve by hand within operatorWait.waitSeconds if
  # you deliberately want that shape.
  installPlanApproval: Manual
  # Source catalog for the operator
  source: community-operators
  # Namespace where the catalog source is located
  sourceNamespace: openshift-marketplace

  # Compute resources for the OPERATOR's own pod, passed through to the Subscription's
  # spec.config.resources.
  #
  # Set by default, and deliberately LOWER per container than what the operator's own CSV declares. Measured
  # on the shipped bundle: `manager` requests 300m/200Mi and `kube-rbac-proxy` requests NOTHING, with no
  # limits anywhere. Because OLM applies one block to every container (see 1 below), 100m each means the pod
  # asks for 200m — LESS than the 300m it asks for today — so this default cannot make the operator harder to
  # schedule than it already is, while giving the sidecar the floor it never had.
  #
  # Verified live at these values: both containers 100m/100Mi, pod Burstable, 0 restarts, no OOM, and both
  # CRs completing a full sync (21 and 41 groups).
  #
  # THREE THINGS TO KNOW BEFORE SETTING THIS. All three were measured against a live cluster, not inferred.
  #
  # 1. EVERY NUMBER COUNTS TWICE. OLM applies one resources block to EVERY container in the pod and has no
  #    per-container form, so `cpu: 500m` asks the scheduler for 1000m — 500m for the manager and 500m for
  #    the kube-rbac-proxy sidecar that previously requested nothing. Size for the pod, not the container.
  #
  # 2. IT REPLACES, IT DOES NOT MERGE. The manager's CSV-declared 300m/200Mi disappears the moment this is
  #    set. So a requests-only configuration must still ask for at least what the manager needs, or the
  #    operator has been quietly downgraded.
  #
  # 3. TOO LARGE FAILS QUIETLY. If the total does not fit the node, the new pod sits Pending with
  #    "Insufficient cpu", the OLD pod keeps serving, and `helm upgrade` still reports success — nothing
  #    turns red. After setting this, check that the rollout actually completed:
  #
  #      oc rollout status deploy/<subscription.name>-controller-manager -n <groupSync.namespace>
  #
  # requests and limits are independent, which is the point of a pass-through. Setting requests alone is the
  # production shape for a busy directory: the operator is guaranteed its share and can still burst, and the
  # pod stays Burstable rather than becoming Guaranteed.
  #
  #   resources:
  #     requests:
  #       cpu: 500m          # remember: x2 containers = 1000m asked of the scheduler
  #       memory: 500Mi
  #
  # Add limits only to cap it; matching limits to requests makes the pod Guaranteed, which also means it is
  # OOMKilled rather than throttled when memory runs out.
  #
  # To hand sizing back to the operator's own CSV entirely, use `null` — NOT `{}`:
  #
  #     subscription:
  #       resources: null          # in a values file
  #     --set subscription.resources=null
  #
  # `{}` does NOT work, and this was measured rather than assumed. Helm coalesces a user-supplied empty map
  # with the chart default and copies the default's sub-keys straight back in, so `resources: {}` still
  # renders 100m/100Mi. Individual leaves can be dropped the same way — `--set
  # subscription.resources.requests.cpu=null` leaves memory in place and removes only the cpu request.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi

# -------------------- OAuth Secret Extraction Configuration --------------------
# Controls the Job that extracts password from OAuth LDAP secret and creates GroupSync secret
oauthSecretExtraction:
  # Enable or disable the OAuth secret extraction job.
  #
  # This gates the CREDENTIALS half only: reading the bind password out of the cluster's OAuth LDAP identity
  # provider and writing groupSync.credentialsSecret. The CA half is caCopy.enabled below, and the two are
  # independent — see the note there.
  #
  # false means the bind Secret is YOURS to create, with the keys username and password:
  #
  #   oc create secret generic ldap-group-sync -n group-sync-operator \
  #     --from-literal=username='<bind DN>' --from-literal=password='<bind password>'
  #
  # That is the mode for a cluster with no OAuth LDAP identity provider to extract from — one that
  # authenticates some other way, or is not OpenShift at all — and for one where platform automation already
  # places the credentials. A missing key is not an error to the operator: it substitutes an empty string and
  # binds anonymously, so the key names matter more than they look. See groupSync.credentialsSecret above.
  enabled: true

  # Service account configuration for OAuth secret extraction
  serviceAccount:
    # Name of the service account to create and use
    name: oauth-secret-extractor

  # OpenShift CLI image for secret extraction
  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: v4.14
    pullPolicy: IfNotPresent

  # Source secret configuration (OAuth LDAP secret)
  sourceSecret:
    # EMPTY on purpose: read from the same LDAP identity provider as bindDN above, so the DN and the
    # password always belong together. Resolved at RUNTIME by the Job, so it is safe under
    # `helm template` too. When empty, RBAC grants the read through a Role in the namespace below
    # rather than a pinned resourceNames rule, since the name is not known at render time.
    #
    # The local test directory value, for reference:
    #   name: ldap-secret
    name: ""
    # Fixed by the OpenShift API: oauth.spec.identityProviders[].ldap.bindPassword is a name-only
    # reference in openshift-config, with the password under the bindPassword key.
    namespace: openshift-config
    passwordKey: bindPassword

  # Target secret configuration (GroupSync secret)
  targetSecret:
    name: ldap-group-sync
    namespace: group-sync-operator

  # Copies the CA the cluster's OAuth LDAP identity provider already trusts into
  # groupSync.namespace, so the operator reads it from its own namespace.
  #
  # On by default, and only runs when a CA is actually needed — needsCa, meaning an ldaps:// url or
  # insecure false. Referencing openshift-config in place needs cross-namespace ConfigMap read, which
  # the operator has on some clusters and not others, and where it is denied the only symptom is the
  # operator reconciling forever on "ConfigMap ... not found". A local copy removes the dependency, so
  # groupSync.ca must point at destinationCa below.
  caCopy:
    # Independent of oauthSecretExtraction.enabled above, and deliberately so.
    #
    # Until 0.6.0 this flag read like a peer and behaved like a subordinate: the copy lived inside the
    # extraction Job, so enabled=false removed the copy, its preflight and its RBAC while the GroupSync CR
    # went on naming destinationCa.name below. Nothing created that object, and the only symptom was the
    # operator reconciling forever on "caSecret must be specified when insecure=false". The copy now has its
    # own Job and its own gate.
    #
    # The four combinations, with groupSync needing a CA at all (ldaps:// or insecure=false):
    #
    #   extraction  copy   what runs
    #   true        true   both: credentials extracted, CA copied              (the default)
    #   true        false  credentials extracted; groupSync.ca is yours, and is preflighted before use
    #   false       true   CA copied; the bind Secret is yours to create
    #   false       false  neither — both are yours, and nothing here checks them. Point groupSync.ca at
    #                      the CA you actually have: leaving it at destinationCa.name names a copy that
    #                      will not be made. NOTES.txt warns about exactly that.
    enabled: true

    # Reads the ConfigMap name from the OAuth CR's LDAP identity provider rather than trusting
    # sourceCa.name, so a cluster that named it something else still works. Falls back to the
    # configured name when the OAuth CR has no LDAP provider.
    #
    # Only the NAME is discovered: oauth.spec.identityProviders[].ldap.ca is a name-only reference,
    # and the API fixes the namespace to openshift-config and the key to ca.crt.
    discoverFromOAuth: true

    # Where the CA comes from. The cluster's OAuth LDAP identity provider reads it here, and the
    # name is overridden by discovery above when the OAuth CR names a different one.
    sourceCa:
      name: ca-config-map
      namespace: openshift-config
      key: ca.crt

    # Where the operator reads it. Named -copy on purpose: the extraction job overwrites it on every
    # install and upgrade, so hand edits are lost — the name says so.
    #
    # ConfigMap, not Secret: a CA is public, and groupSync.ca.kind defaults to ConfigMap. Set kind to
    # Secret to keep it out of reach of namespace readers. Must match groupSync.ca.
    destinationCa:
      kind: ConfigMap
      name: ca-config-map-copy
      namespace: group-sync-operator
      key: ca.crt

  # LDAP bind DN for the GroupSync secret
  # EMPTY on purpose: read from the cluster OAuth CR's first LDAP identity provider by the extraction
  # Job. Unlike groupSync.url this is resolved at RUNTIME, so it is safe to leave empty under
  # `helm template` and an offline GitOps render — the Job reads the CR when it runs.
  #
  # The local test directory value, for reference:
  #   bindDN: "cn=ocp-ldap-bind-serviceid,ou=TrustedApplications,dc=ephico2real,dc=com"
  bindDN: ""

  # Job configuration
  waitTimeout: 300  # seconds to wait for source secret
  backoffLimit: 3
  # NO ttlSecondsAfterFinished here, deliberately. It used to be documented as 300, but BOTH consumers —
  # 01.5's extraction Job and 01.6's CA Job — carry the field as a YAML comment, "kept for audit purposes",
  # so the value was inert and the documentation promised something nothing implemented. Those two Jobs are
  # kept after completion on purpose: their logs record which credential and which CA were installed. The
  # approver and operator-wait Jobs below DO set it, and theirs are real.
  #
  # 01.8's pre-delete Job removes the objects these two create; the Jobs themselves go on the next install's
  # before-hook-creation, or with the namespace.

  # Resource limits for the extraction job
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -------------------- InstallPlan approver --------------------
# Approves the InstallPlan for this subscription so Manual approval installs unattended, while
# later upgrades still wait for a human. Refuses any plan that does not name this subscription.
#
# Renders only for Manual; with Automatic, OLM approves its own plans.
installPlanApprover:
  enabled: true
  waitSeconds: 300
  # 0: retrying re-waits from zero and turns a 5-minute failure into a 30-minute one with the
  # same message at the end.
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: v4.14
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# -------------------- Operator readiness wait --------------------
# A Job that blocks the install until the operator can serve GroupSync: CSV Succeeded, Deployment
# ready, CRD Established.
#
# Without it an install can report success while nothing reconciles — Helm applies unknown kinds
# last by name, and "GroupSync" sorts before "Subscription", so a CR can be created before the
# operator is subscribed.
operatorWait:
  enabled: true

  # Applies to all three checks together (CSV Succeeded, Deployment available, CRD Established),
  # not per check. 300s covers a cold catalog pull on a slow cluster. A Manual
  # installPlanApproval with nobody to approve it will use the whole budget and then fail with
  # the command to run — which is the right outcome, since it genuinely is not installed.
  #
  # Enforced by one wall-clock deadline taken before the first check, so raising this raises the total and
  # nothing else. It did NOT hold until 0.8.0: the retry count was computed once and used by each of the
  # three loops, so every check got the full budget and the total could reach 3x this — except the pod's
  # activeDeadlineSeconds (this + 120) killed it part-way, with no message of its own. If a slow cluster
  # needs longer, raise this value; the pod deadline follows it automatically.
  waitSeconds: 300

  # 0, not the default 6. Retrying a timeout re-waits from zero and turns a 5-minute failure into
  # a 30-minute one, with the same message at the end.
  backoffLimit: 0

  ttlSecondsAfterFinished: 300

  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: v4.14
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# -------------------- Test Configuration --------------------
# Controls settings for the Helm tests
test:
  # Enable or disable the test pods
  enabled: true

  # OpenShift CLI image configuration for operator health testing.
  # Pinned for the same reason as ldapClientImage below: ose-cli:latest floats between builds with
  # and without openssl, so a floating tag makes the same chart behave differently per cluster.
  operatorHealthImage:
    repository: "registry.redhat.io/openshift4/ose-cli"
    tag: "v4.14"
    pullPolicy: IfNotPresent

  # LDAP client image configuration for LDAP connection testing
  # Seconds Test 4 waits for a GroupSync to report a first successful sync.
  syncWaitSeconds: 180

  # ose-cli, not the operator image: the connection test needs oc to read the CA and the sync status
  # and curl to verify the LDAPS chain. The operator image has neither, so every check degraded to
  # "informational" and the suite passed without testing anything.
  #
  # PINNED, not latest. ose-cli:latest floats: one build ships openssl and a newer one does not, so a
  # floating tag made the same chart pass on one cluster and fail on another with "openssl missing".
  # v4.14 is verified to carry oc and curl, which is all the tests use.
  ldapClientImage:
    repository: "registry.redhat.io/openshift4/ose-cli"
    tag: "v4.14"
    # Image pull policy
    pullPolicy: IfNotPresent
