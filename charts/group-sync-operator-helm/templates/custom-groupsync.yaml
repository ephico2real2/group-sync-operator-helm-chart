# Custom (multi-tenant) GroupSync CRs. See docs/DESIGN_custom_groupsync.md.
#
# One CR per enabled item in .Values.customGroupSyncs.items:
#   name     = item.name (unique -> unique ownership label)
#   provider = "ldap" (fixed)
#   filter   = built from item.groupCn (+ item.objectClass), or item.filter to override
#   members  = item.groupMembershipAttributes, else inherited
#   conn     = inherited from .Values.groupSync
#
# One naming pattern = one CR. Non-overlap is guaranteed by the org naming standard, not here.
{{- if .Values.customGroupSyncs.enabled }}
{{- $root := . }}
{{- range .Values.customGroupSyncs.items }}
{{- if .enabled }}
{{- $item := . }}
# Inherit the base groupSync, override the three per-tenant fields. deepCopy so the shared
# values are never mutated.

{{- $cfg := deepCopy $root.Values.groupSync }}
{{- include "group-sync-operator-helm.applyInjectedCa" (list $root $cfg) }}
{{- if not (or $item.filter $item.groupCn) }}
{{- fail (printf "customGroupSyncs item %q has neither groupCn nor filter.\n  groupCn builds the filter (&(objectClass=<objectClass|groupOfNames>)(cn=<groupCn>)); filter overrides it wholesale.\n  With neither, printf renders the missing value as the literal %%!s(<nil>) INTO the CR's filter, which\n  the operator then uses verbatim — it matches nothing, and the only symptom is a tenant that syncs no\n  groups. Set one of them." ($item.name | default "<unnamed>")) }}
{{- end }}
# objectClass accepts a STRING or A LIST, and a list becomes an OR clause. Both spellings of a group
# exist — groupOfNames with `member`, groupOfUniqueNames with `uniqueMember` — and one directory
# routinely has both, so a pattern that must match either would otherwise need the raw `filter`
# escape hatch and lose the declarative groupCn.
#
#   objectClass: groupOfNames                              -> (objectClass=groupOfNames)
#   objectClass: ["groupOfNames","groupOfUniqueNames"]     -> (|(objectClass=groupOfNames)(objectClass=groupOfUniqueNames))
#
# Naming both costs nothing on a directory that has one of them: an OR clause simply does not match
# what is not there. A single-item list renders WITHOUT the `(|...)` wrapper, because `(|(x))` is legal
# but reads as a mistake to anyone auditing the CR.
{{- $objectClass := $item.objectClass | default "groupOfNames" }}
{{- $ocClause := "" }}
{{- if kindIs "slice" $objectClass }}
{{- if eq (len $objectClass) 1 }}
{{- $ocClause = printf "(objectClass=%s)" (index $objectClass 0) }}
{{- else }}
{{- $parts := list }}
{{- range $objectClass }}{{- $parts = append $parts (printf "(objectClass=%s)" .) }}{{- end }}
{{- $ocClause = printf "(|%s)" (join "" $parts) }}
{{- end }}
{{- else }}
{{- $ocClause = printf "(objectClass=%s)" $objectClass }}
{{- end }}
{{- $filter := $item.filter | default (printf "(&%s(cn=%s))" $ocClause $item.groupCn) }}
{{- $_ := set $cfg.rfc2307.groupsQuery "filter" $filter }}
# WHICH ATTRIBUTE HOLDS THE MEMBERS, overridable per item because it is not the same on every group.
#
# A group is groupOfNames with `member` or groupOfUniqueNames with `uniqueMember`, and one directory
# routinely has both — on the reference lab the app-ocp-rbac-* groups are groupOfNames while the
# OAuth login-gate group is groupOfUniqueNames. Inheriting the base `["member"]` for such a group
# syncs it with ZERO MEMBERS and looks like a working sync: the CR reports success, the Group object
# exists, and it is empty. That failure is silent, which is why this override exists rather than
# being left to `filter` alone — a filter fixes which groups are FOUND, not which members are READ.
#
# Naming both attributes is safe and is what the shipped cluster-access item does: the operator reads
# every attribute listed, so a group with only one of them is unaffected. Verified on the reference
# directory — ["member","uniqueMember"] against a groupOfUniqueNames group still syncs all 8 members.
{{- if $item.groupMembershipAttributes }}
{{- $_ := set $cfg.rfc2307 "groupMembershipAttributes" $item.groupMembershipAttributes }}
{{- end }}
{{- $_ := set $cfg "providerName" "ldap" }}
{{- if $item.schedule }}{{- $_ := set $cfg "schedule" $item.schedule }}{{- end }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: GroupSync
metadata:
  name: {{ $item.name }}
  namespace: {{ $item.namespace | default $cfg.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
{{ include "group-sync-operator-helm.groupsyncSpec" $cfg }}
{{- end }}
{{- end }}
{{- end }}
