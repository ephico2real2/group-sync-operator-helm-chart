# Custom (multi-tenant) GroupSync CRs. See docs/DESIGN_custom_groupsync.md.
#
# One CR per enabled item in .Values.customGroupSyncs.items:
#   name     = item.name (unique -> unique ownership label)
#   provider = "ldap" (fixed)
#   filter   = built from item.groupCn, or item.filter to override
#   conn     = inherited from .Values.groupSync
#
# One naming pattern = one CR. Non-overlap is guaranteed by the org naming standard, not here.
{{- if .Values.customGroupSyncs.enabled }}
{{- $root := . }}
{{- range .Values.customGroupSyncs.items }}
{{- if .enabled }}
{{- $item := . }}
# Inherit the base groupSync, override the three per-tenant fields. deepCopy so the shared
# values are never mutated.

{{- $cfg := deepCopy $root.Values.groupSync }}
{{- $filter := $item.filter | default (printf "(&(objectClass=groupOfNames)(cn=%s))" $item.groupCn) }}
{{- $_ := set $cfg.rfc2307.groupsQuery "filter" $filter }}
{{- $_ := set $cfg "providerName" "ldap" }}
{{- if $item.schedule }}{{- $_ := set $cfg "schedule" $item.schedule }}{{- end }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: GroupSync
metadata:
  name: {{ $item.name }}
  namespace: {{ $item.namespace | default $cfg.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
{{ include "group-sync-operator-helm.groupsyncSpec" $cfg }}
{{- end }}
{{- end }}
{{- end }}
