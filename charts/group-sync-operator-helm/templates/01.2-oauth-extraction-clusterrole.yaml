{{- if .Values.oauthSecretExtraction.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-secret-extraction
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-secret-extraction
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
{{- if .Values.oauthSecretExtraction.sourceSecret.name }}
# The source OAuth secret, by name. Omitted when the name is unset: the Job discovers it from the
# OAuth CR, and resourceNames cannot pin a name that is not known at render time — the Role in that
# namespace grants the read instead.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  resourceNames: ["{{ .Values.oauthSecretExtraction.sourceSecret.name }}"]
{{- end }}
# Access to secrets in group-sync-operator namespace (target secret)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
  resourceNames: ["{{ .Values.oauthSecretExtraction.targetSecret.name }}"]
# Access to create secrets in group-sync-operator namespace (for target secret creation)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
# Access to namespaces (to check and create target namespace if needed)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "create"]
  resourceNames: ["{{ .Values.oauthSecretExtraction.targetSecret.namespace }}"]
# Access to check namespace existence
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
{{- if or .Values.oauthSecretExtraction.caCopy.discoverFromOAuth (not .Values.oauthSecretExtraction.bindDN) (not .Values.oauthSecretExtraction.sourceSecret.name) }}
# Reads the cluster OAuth CR. Deliberately OUTSIDE the needsCa and caCopy gates: the Job resolves the
# bind DN and password secret at the TOP of its script, before any CA work and regardless of whether a
# CA is needed. Nested inside those gates, `ldap:// + insecure=true` or `caCopy.enabled=false` with an
# empty bindDN produced a Job that calls this API with no permission — measured as 0 oauths rules
# against 2 `oc get oauth cluster` calls.
#
# Cluster-scoped resource, so it must live in a ClusterRole; pinned to the single object named "cluster".
- apiGroups: ["config.openshift.io"]
  resources: ["oauths"]
  verbs: ["get"]
  resourceNames: ["cluster"]
{{- end }}
{{- if include "group-sync-operator-helm.needsCa" .Values.groupSync }}
# Read the CA that groupSync.ca points at, so the preflight can verify it before the operator
# reconciles. Named, so this SA cannot read anything else in that namespace.
- apiGroups: [""]
  resources: [{{ if eq (.Values.groupSync.ca.kind | default "ConfigMap") "Secret" }}"secrets"{{ else }}"configmaps"{{ end }}]
  verbs: ["get", "list"]
  resourceNames: ["{{ .Values.groupSync.ca.name }}"]
{{- if .Values.oauthSecretExtraction.caCopy.enabled }}
# The copy target in groupSync.namespace, which is what groupSync.ca should point at.
- apiGroups: [""]
  resources: [{{ if eq (.Values.oauthSecretExtraction.caCopy.destinationCa.kind | default "ConfigMap") "Secret" }}"secrets"{{ else }}"configmaps"{{ end }}]
  verbs: ["get", "update", "patch"]
  resourceNames: ["{{ .Values.oauthSecretExtraction.caCopy.destinationCa.name }}"]
# create takes no resourceNames — RBAC ignores them for create, so the name cannot be pinned here.
- apiGroups: [""]
  resources: [{{ if eq (.Values.oauthSecretExtraction.caCopy.destinationCa.kind | default "ConfigMap") "Secret" }}"secrets"{{ else }}"configmaps"{{ end }}]
  verbs: ["create"]
{{- end }}
{{- end }}
{{- end }}
{{- $caRead := and .Values.oauthSecretExtraction.caCopy.enabled (include "group-sync-operator-helm.needsCa" .Values.groupSync) }}
{{- $secretRead := not .Values.oauthSecretExtraction.sourceSecret.name }}

{{/*
Roles, not more ClusterRole rules: these names are not known until the Job reads the OAuth CR, and an
unpinned rule in a ClusterRole would grant them in EVERY namespace.

TWO Roles, in two namespaces, because the Job reads the two objects from two different places:

  the CA ConfigMap    caCopy.sourceCa.namespace       (CA_SRC_NS in the Job)
  the bind Secret     oauthSecretExtraction.sourceSecret.namespace

Both rules used to live in one Role in caCopy.sourceCa.namespace. They default to the same namespace
(openshift-config), so it worked — but point sourceSecret.namespace anywhere else and the Job reads a
Secret in a namespace nothing granted it, and fails with a Forbidden that names the right verb on the
wrong namespace.

get alone is not enough in either: listing is how the Job reports the available keys when the expected
one is missing, and RBAC does not honour resourceNames for list.
*/}}
{{- if and .Values.oauthSecretExtraction.enabled $caRead }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-ca-read
  namespace: {{ .Values.oauthSecretExtraction.caCopy.sourceCa.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-secret-extraction
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-ca-read
  namespace: {{ .Values.oauthSecretExtraction.caCopy.sourceCa.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-secret-extraction
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-ca-read
subjects:
- kind: ServiceAccount
  name: {{ .Values.oauthSecretExtraction.serviceAccount.name }}
  namespace: {{ .Values.groupSync.namespace }}
{{- end }}

{{- if and .Values.oauthSecretExtraction.enabled $secretRead }}
---
# sourceSecret.name is unset, so the Job discovers it from the OAuth CR and the ClusterRole's pinned
# rule cannot cover a name that is not known at render time.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-secret-read
  namespace: {{ .Values.oauthSecretExtraction.sourceSecret.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-secret-extraction
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-secret-read
  namespace: {{ .Values.oauthSecretExtraction.sourceSecret.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-secret-extraction
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-secret-read
subjects:
- kind: ServiceAccount
  name: {{ .Values.oauthSecretExtraction.serviceAccount.name }}
  namespace: {{ .Values.groupSync.namespace }}
{{- end }}

