{{- if .Values.test.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-test-sa
  namespace: {{ .Values.groupSync.namespace }}
  annotations:
    # Not a helm test hook. helm test --logs fetches pod logs for every test hook and fails
    # with 'unable to get pod logs ...: pods "..." not found' on any hook that is not a Pod.
    # As an ordinary release resource this also exists before the test Jobs run.
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-test-role
  annotations:
    # Not a helm test hook. helm test --logs fetches pod logs for every test hook and fails
    # with 'unable to get pod logs ...: pods "..." not found' on any hook that is not a Pod.
    # As an ordinary release resource this also exists before the test Jobs run.
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "secrets", "configmaps", "events"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
- apiGroups: ["redhatcop.redhat.io"]
  resources: ["groupsyncs"]
  verbs: ["get", "list"]
- apiGroups: ["user.openshift.io"]
  resources: ["groups"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-test-ca-role
  namespace: {{ .Values.groupSync.ca.namespace }}
  annotations:
    # Not a helm test hook. helm test --logs fetches pod logs for every test hook and fails
    # with 'unable to get pod logs ...: pods "..." not found' on any hook that is not a Pod.
    # As an ordinary release resource this also exists before the test Jobs run.
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
rules:
# Follows groupSync.ca.kind: the CA can be a Secret copied into this namespace or a ConfigMap
# referenced directly, and granting the wrong one leaves the test unable to read it.
- apiGroups: [""]
  resources: [{{ if eq (.Values.groupSync.ca.kind | default "ConfigMap") "Secret" }}"secrets"{{ else }}"configmaps"{{ end }}]
  verbs: ["get", "list"]
  resourceNames: ["{{ .Values.groupSync.ca.name }}"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-test-ca-binding
  namespace: {{ .Values.groupSync.ca.namespace }}
  annotations:
    # Not a helm test hook. helm test --logs fetches pod logs for every test hook and fails
    # with 'unable to get pod logs ...: pods "..." not found' on any hook that is not a Pod.
    # As an ordinary release resource this also exists before the test Jobs run.
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-test-sa
  namespace: {{ .Values.groupSync.namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-test-ca-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-test-binding
  annotations:
    # Not a helm test hook. helm test --logs fetches pod logs for every test hook and fails
    # with 'unable to get pod logs ...: pods "..." not found' on any hook that is not a Pod.
    # As an ordinary release resource this also exists before the test Jobs run.
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-test-sa
  namespace: {{ .Values.groupSync.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-test-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}

