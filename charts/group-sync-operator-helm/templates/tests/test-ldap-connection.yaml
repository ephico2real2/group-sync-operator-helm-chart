{{- if .Values.test.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-ldap-connection"
  namespace: {{ .Values.groupSync.namespace }}
  annotations:
    "helm.sh/hook": test
    # A Pod, not a Job. helm test --logs looks up a pod named after the hook itself, and a
    # Job's pods are <job>-<suffix> — so a Job hook always fails with
    # 'unable to get pod logs ...: pods "..." not found' and helm test exits 1.
    # A Pod also means no retry, which is right for a test: a retried failure hides flakiness.
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "20"
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    test-type: "ldap-connection"
spec:
  serviceAccountName: {{ .Release.Name }}-test-sa
  containers:
    - name: ldap-test
      image: {{ .Values.test.ldapClientImage.repository }}:{{ .Values.test.ldapClientImage.tag }}
      imagePullPolicy: {{ .Values.test.ldapClientImage.pullPolicy }}
      command:
        - /bin/bash
        - -c
        - |
          /scripts/ldap-connection-test.sh
      env:
        # Every value here has to be the one the GroupSync CR ACTUALLY got, not the raw values field, or
        # the suite verifies something the operator is not using. Two of them differ:
        #
        #   url     the CR takes it from ldapUrl, which falls back to the cluster's OAuth LDAP provider
        #           when groupSync.url is empty. Baking .Values.groupSync.url meant that on a
        #           discovery-based install — the qa-values.yaml shape — this rendered "" while the CR
        #           held a real url, and both scripts treat an empty url as a hard failure. So
        #           `helm test` failed outright on the documented QA path.
        #   ca.key  the CR defaults it to ca.crt; without the same default an emptied ca.key gives the
        #           CR ca.crt and the test "", so it looks for a key that is not there.
        #
        # ldapUrlOrEmpty, not ldapUrl: the fail-closed variant would break a render that works today.
        # With groupSync.enabled=false and customGroupSyncs.enabled=false the chart still emits 22
        # objects including these test pods, and nothing there can derive a url. Measured, not assumed.
        - name: GROUPSYNC_URL
          value: "{{ include "group-sync-operator-helm.ldapUrlOrEmpty" .Values.groupSync }}"
        - name: GROUPSYNC_INSECURE
          value: "{{ .Values.groupSync.insecure }}"
        - name: GROUPSYNC_NAMESPACE
          value: "{{ .Values.groupSync.namespace }}"
        - name: GROUPS_BASE_DN
          value: "{{ .Values.groupSync.rfc2307.groupsQuery.baseDN }}"
        - name: USERS_BASE_DN
          value: "{{ .Values.groupSync.rfc2307.usersQuery.baseDN }}"
        - name: GROUPS_FILTER
          value: "{{ .Values.groupSync.rfc2307.groupsQuery.filter }}"
        - name: USERS_FILTER
          value: "{{ .Values.groupSync.rfc2307.usersQuery.filter | default "(objectClass=inetOrgPerson)" }}"
        - name: CA_NAME
          value: "{{ .Values.groupSync.ca.name }}"
        - name: CA_NAMESPACE
          value: "{{ .Values.groupSync.ca.namespace }}"
        - name: CA_KEY
          value: "{{ .Values.groupSync.ca.key | default "ca.crt" }}"
        - name: CA_KIND
          value: "{{ .Values.groupSync.ca.kind | default "ConfigMap" }}"
        - name: SYNC_WAIT_SECONDS
          value: "{{ .Values.test.syncWaitSeconds | default 180 }}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: ldap-credentials
          mountPath: /credentials
          readOnly: true
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
  volumes:
    - name: scripts
      configMap:
        name: {{ .Release.Name }}-test-scripts
        defaultMode: 0755
    - name: ldap-credentials
      secret:
        secretName: {{ .Values.oauthSecretExtraction.targetSecret.name }}
        defaultMode: 0400
  restartPolicy: Never
  # runAsNonRoot is deliberately NOT set. The image declares USER 0, so asserting it without a
  # runAsUser depends entirely on the SCC injecting one: restricted-v2 assigns a UID from the
  # namespace range and it works, but a RunAsAny SCC injects nothing and the kubelet refuses with
  # "container has runAsNonRoot and image will run as root". Pinning a runAsUser instead would
  # break restricted-v2, whose MustRunAsRange rejects any UID outside the namespace range — so the
  # SCC governs the user, and this keeps only the hardening that never conflicts.
  securityContext:
    seccompProfile:
      type: RuntimeDefault
{{- end }}

