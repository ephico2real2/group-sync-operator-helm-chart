{{- if .Values.test.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-test-scripts
  namespace: {{ .Values.groupSync.namespace }}
  annotations:
    # Not a helm test hook. helm test --logs fetches pod logs for every test hook and fails
    # with 'unable to get pod logs ...: pods "..." not found' on any hook that is not a Pod.
    # As an ordinary release resource this also exists before the test Jobs run.
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
data:
  operator-health-test.sh: |
{{ .Files.Get "files/operator-health-test.sh" | indent 4 }}
  ldap-connection-test.sh: |
{{ .Files.Get "files/ldap-connection-test.sh" | indent 4 }}
{{- end }}

