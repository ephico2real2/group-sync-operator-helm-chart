# Extracts the LDAP bind credentials from the cluster's OAuth identity provider into the Secret the operator
# reads. CA work lives in 01.6-ldap-ca-job.yaml: it is gated independently, because a cluster can need the CA
# copied without having an OAuth LDAP provider to extract anything from.
{{- if .Values.oauthSecretExtraction.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-secret-extraction
  namespace: {{ .Values.groupSync.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-secret-extraction
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # ttlSecondsAfterFinished: {{ .Values.oauthSecretExtraction.ttlSecondsAfterFinished }} # Commented out to keep Job for audit purposes
  backoffLimit: {{ .Values.oauthSecretExtraction.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "group-sync-operator-helm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: oauth-secret-extraction
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/01-operator-subscription.yaml") . | sha256sum }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.oauthSecretExtraction.serviceAccount.name }}
      containers:
      - name: oauth-secret-extractor
        image: {{ .Values.oauthSecretExtraction.image.repository }}:{{ .Values.oauthSecretExtraction.image.tag }}
        imagePullPolicy: {{ .Values.oauthSecretExtraction.image.pullPolicy }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          
          # The OAuth CR is the authority on the bind credentials, so an empty value is read off it
          # rather than duplicated in values. Done here, not in a Helm helper, because these are only
          # ever written into the target secret — nothing needs them at template time.
          #
          # ONE query returns the name, bindDN and password secret of the FIRST LDAP provider, so the
          # DN and the password can never come from different providers. Note the filter: a bare
          # identityProviders[0] would be the first provider of ANY type, which is commonly HTPasswd.
          # A cluster with several LDAP stanzas normally points them all at one directory, differing
          # only in the search base, so the first is the right one — and it is named in the log below
          # so you can see which was used.
          BIND_DN='{{ .Values.oauthSecretExtraction.bindDN }}'
          SRC_SECRET='{{ .Values.oauthSecretExtraction.sourceSecret.name }}'

          if [[ -z "$BIND_DN" || -z "$SRC_SECRET" ]]; then
            IDP=$(oc get oauth cluster \
              -o jsonpath='{range .spec.identityProviders[?(@.type=="LDAP")]}{.name}{"|"}{.ldap.bindDN}{"|"}{.ldap.bindPassword.name}{"\n"}{end}' \
              2>/dev/null | grep -v '^$' | head -1)

            if [[ -z "$IDP" ]]; then
              echo "❌ bindDN or sourceSecret.name is empty, and the OAuth CR has no LDAP identity"
              echo "   provider to read them from. Set them explicitly, or add an LDAP provider."
              echo "   Providers present:"
              oc get oauth cluster \
                -o jsonpath='{range .spec.identityProviders[*]}     {.name}={.type}{"\n"}{end}' 2>/dev/null
              exit 1
            fi

            IDP_NAME="${IDP%%|*}"
            IDP_REST="${IDP#*|}"
            echo "🔎 Reading bind credentials from OAuth identity provider '${IDP_NAME}'"

            if [[ -z "$BIND_DN" ]]; then
              BIND_DN="${IDP_REST%%|*}"
              [[ -n "$BIND_DN" ]] || { echo "❌ provider '${IDP_NAME}' declares no bindDN"; exit 1; }
              echo "   bindDN: ${BIND_DN}"
            fi
            if [[ -z "$SRC_SECRET" ]]; then
              SRC_SECRET="${IDP_REST##*|}"
              [[ -n "$SRC_SECRET" ]] || { echo "❌ provider '${IDP_NAME}' declares no bindPassword secret"; exit 1; }
              echo "   bindPassword secret: ${SRC_SECRET}"
            fi
          fi

          echo "🔄 OAuth Secret Extraction Job Started"
          echo "====================================="
          echo "Source Secret: ${SRC_SECRET} ({{ .Values.oauthSecretExtraction.sourceSecret.namespace }})"
          echo "Target Secret: {{ .Values.oauthSecretExtraction.targetSecret.name }} ({{ .Values.oauthSecretExtraction.targetSecret.namespace }})"
          echo "Bind DN: ${BIND_DN}"
          echo
          
          # Wait for source secret to exist
          echo "🔍 Waiting for source secret to exist..."
          timeout={{ .Values.oauthSecretExtraction.waitTimeout }}
          while [ $timeout -gt 0 ]; do
            if oc get secret ${SRC_SECRET} -n {{ .Values.oauthSecretExtraction.sourceSecret.namespace }} >/dev/null 2>&1; then
              echo "✅ Source secret found"
              break
            fi
            echo "⏳ Waiting for source secret... ($timeout seconds remaining)"
            sleep 10
            timeout=$((timeout - 10))
          done
          
          if [ $timeout -le 0 ]; then
            echo "❌ Timeout waiting for source secret ${SRC_SECRET}"
            exit 1
          fi
          
          # Extract password from source secret
          echo "🔐 Extracting bindPassword from source secret..."
          BIND_PASSWORD=$(oc get secret ${SRC_SECRET} \
            -n {{ .Values.oauthSecretExtraction.sourceSecret.namespace }} \
            -o jsonpath='{.data.{{ .Values.oauthSecretExtraction.sourceSecret.passwordKey }}}' | base64 -d)
          
          if [[ -z "$BIND_PASSWORD" ]]; then
            echo "❌ Failed to extract bindPassword from source secret"
            echo "Please verify the secret exists and contains key '{{ .Values.oauthSecretExtraction.sourceSecret.passwordKey }}'"
            exit 1
          fi
          
          echo "✅ Successfully extracted bindPassword (${#BIND_PASSWORD} characters)"
          
          # Create target namespace if it doesn't exist
          if ! oc get namespace {{ .Values.oauthSecretExtraction.targetSecret.namespace }} >/dev/null 2>&1; then
            echo "📁 Creating target namespace {{ .Values.oauthSecretExtraction.targetSecret.namespace }}"
            oc create namespace {{ .Values.oauthSecretExtraction.targetSecret.namespace }}
          fi
          
          # Create target secret with extracted password using dry-run + apply
          echo "🔑 Creating target secret with extracted password..."
          
          # Create the secret using oc create dry-run and then apply
          oc create secret generic {{ .Values.oauthSecretExtraction.targetSecret.name }} \
            --from-literal=username="$BIND_DN" \
            --from-literal=password="$BIND_PASSWORD" \
            -n {{ .Values.oauthSecretExtraction.targetSecret.namespace }} \
            --dry-run=client -o yaml | oc apply -f -
          
          echo "✅ Target secret created or updated successfully"
          
          # Verification
          echo "🔍 Verifying created secret..."
          oc get secret {{ .Values.oauthSecretExtraction.targetSecret.name }} \
            -n {{ .Values.oauthSecretExtraction.targetSecret.namespace }}
          
          echo "📋 Secret contains keys:"
          if oc get secret {{ .Values.oauthSecretExtraction.targetSecret.name }} \
            -n {{ .Values.oauthSecretExtraction.targetSecret.namespace }} \
            -o jsonpath='{.data}' | jq -r 'keys[]' 2>/dev/null; then
            echo
          else
            echo "  - username"
            echo "  - password"
          fi
          
          echo
          echo "🎉 OAuth secret extraction completed successfully!"
          echo "📝 Summary:"
          echo "  ✓ Extracted password from ${SRC_SECRET}"
          echo "  ✓ Created {{ .Values.oauthSecretExtraction.targetSecret.name }} with username and password"
          echo "  ✓ GroupSync operator can now authenticate to LDAP"
        env:
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: {{ .Values.oauthSecretExtraction.resources.requests.cpu }}
            memory: {{ .Values.oauthSecretExtraction.resources.requests.memory }}
          limits:
            cpu: {{ .Values.oauthSecretExtraction.resources.limits.cpu }}
            memory: {{ .Values.oauthSecretExtraction.resources.limits.memory }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      # runAsNonRoot is deliberately NOT set. The image declares USER 0, so asserting it without a
      # runAsUser depends entirely on the SCC injecting one: restricted-v2 assigns a UID from the
      # namespace range and it works, but a RunAsAny SCC injects nothing and the kubelet refuses with
      # "container has runAsNonRoot and image will run as root". Pinning a runAsUser instead would
      # break restricted-v2, whose MustRunAsRange rejects any UID outside the namespace range — so the
      # SCC governs the user, and this keeps only the hardening that never conflicts.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
{{- end }}

