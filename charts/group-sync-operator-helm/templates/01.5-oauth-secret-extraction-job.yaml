{{/*
The copy is only useful if the operator reads it as the kind the Job wrote it as. These are two
independent values and nothing tied them together, so setting only groupSync.ca.kind: Secret left the
Job creating a ConfigMap while the CR asked for a Secret — the operator then looks for an object that
does not exist, and the first symptom is a reconcile error naming a Secret nobody created.

Refused at render time rather than coerced: coercing would silently override whichever value the user
meant, and there is no way to tell which one that was.
*/}}
{{- if and .Values.oauthSecretExtraction.enabled .Values.oauthSecretExtraction.caCopy.enabled }}
{{- $wrote := .Values.oauthSecretExtraction.caCopy.destinationCa.kind | default "ConfigMap" }}
{{- $reads := include "group-sync-operator-helm.caKind" . }}
{{- if ne $wrote $reads }}
{{- fail (printf "the CA copy is written as a %s but groupSync.ca.kind reads it as a %s.\n  oauthSecretExtraction.caCopy.destinationCa.kind = %s   (what the Job creates)\n  groupSync.ca.kind                             = %s   (what the GroupSync CR loads)\n  Set both to the same kind, or disable oauthSecretExtraction.caCopy.enabled if something else\n  supplies the CA." $wrote $reads $wrote $reads) }}
{{- end }}
{{- end }}
{{- if .Values.oauthSecretExtraction.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "group-sync-operator-helm.fullname" . }}-oauth-secret-extraction
  namespace: {{ .Values.groupSync.namespace }}
  labels:
    {{- include "group-sync-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-secret-extraction
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # ttlSecondsAfterFinished: {{ .Values.oauthSecretExtraction.ttlSecondsAfterFinished }} # Commented out to keep Job for audit purposes
  backoffLimit: {{ .Values.oauthSecretExtraction.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "group-sync-operator-helm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: oauth-secret-extraction
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/01-operator-subscription.yaml") . | sha256sum }}
{{- if and .Values.oauthSecretExtraction.caCopy.enabled (include "group-sync-operator-helm.needsCa" .Values.groupSync) }}
        # A changed source CA changes this, so the pod spec differs and the copy is remade. Gated on
        # needsCa as well as caCopy: with plain ldap:// no copy is made, so hashing a CA the Job never
        # reads would re-run it for nothing.
        checksum/ca-source: {{ include "group-sync-operator-helm.caSourceHash" . }}
{{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.oauthSecretExtraction.serviceAccount.name }}
      containers:
      - name: oauth-secret-extractor
        image: {{ .Values.oauthSecretExtraction.image.repository }}:{{ .Values.oauthSecretExtraction.image.tag }}
        imagePullPolicy: {{ .Values.oauthSecretExtraction.image.pullPolicy }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          
          # The OAuth CR is the authority on the bind credentials, so an empty value is read off it
          # rather than duplicated in values. Done here, not in a Helm helper, because these are only
          # ever written into the target secret — nothing needs them at template time.
          #
          # ONE query returns the name, bindDN and password secret of the FIRST LDAP provider, so the
          # DN and the password can never come from different providers. Note the filter: a bare
          # identityProviders[0] would be the first provider of ANY type, which is commonly HTPasswd.
          # A cluster with several LDAP stanzas normally points them all at one directory, differing
          # only in the search base, so the first is the right one — and it is named in the log below
          # so you can see which was used.
          BIND_DN='{{ .Values.oauthSecretExtraction.bindDN }}'
          SRC_SECRET='{{ .Values.oauthSecretExtraction.sourceSecret.name }}'

          if [[ -z "$BIND_DN" || -z "$SRC_SECRET" ]]; then
            IDP=$(oc get oauth cluster \
              -o jsonpath='{range .spec.identityProviders[?(@.type=="LDAP")]}{.name}{"|"}{.ldap.bindDN}{"|"}{.ldap.bindPassword.name}{"\n"}{end}' \
              2>/dev/null | grep -v '^$' | head -1)

            if [[ -z "$IDP" ]]; then
              echo "❌ bindDN or sourceSecret.name is empty, and the OAuth CR has no LDAP identity"
              echo "   provider to read them from. Set them explicitly, or add an LDAP provider."
              echo "   Providers present:"
              oc get oauth cluster \
                -o jsonpath='{range .spec.identityProviders[*]}     {.name}={.type}{"\n"}{end}' 2>/dev/null
              exit 1
            fi

            IDP_NAME="${IDP%%|*}"
            IDP_REST="${IDP#*|}"
            echo "🔎 Reading bind credentials from OAuth identity provider '${IDP_NAME}'"

            if [[ -z "$BIND_DN" ]]; then
              BIND_DN="${IDP_REST%%|*}"
              [[ -n "$BIND_DN" ]] || { echo "❌ provider '${IDP_NAME}' declares no bindDN"; exit 1; }
              echo "   bindDN: ${BIND_DN}"
            fi
            if [[ -z "$SRC_SECRET" ]]; then
              SRC_SECRET="${IDP_REST##*|}"
              [[ -n "$SRC_SECRET" ]] || { echo "❌ provider '${IDP_NAME}' declares no bindPassword secret"; exit 1; }
              echo "   bindPassword secret: ${SRC_SECRET}"
            fi
          fi

          echo "🔄 OAuth Secret Extraction Job Started"
          echo "====================================="
          echo "Source Secret: ${SRC_SECRET} ({{ .Values.oauthSecretExtraction.sourceSecret.namespace }})"
          echo "Target Secret: {{ .Values.oauthSecretExtraction.targetSecret.name }} ({{ .Values.oauthSecretExtraction.targetSecret.namespace }})"
          echo "Bind DN: ${BIND_DN}"
          echo
          
          # Wait for source secret to exist
          echo "🔍 Waiting for source secret to exist..."
          timeout={{ .Values.oauthSecretExtraction.waitTimeout }}
          while [ $timeout -gt 0 ]; do
            if oc get secret ${SRC_SECRET} -n {{ .Values.oauthSecretExtraction.sourceSecret.namespace }} >/dev/null 2>&1; then
              echo "✅ Source secret found"
              break
            fi
            echo "⏳ Waiting for source secret... ($timeout seconds remaining)"
            sleep 10
            timeout=$((timeout - 10))
          done
          
          if [ $timeout -le 0 ]; then
            echo "❌ Timeout waiting for source secret ${SRC_SECRET}"
            exit 1
          fi
          
          # Extract password from source secret
          echo "🔐 Extracting bindPassword from source secret..."
          BIND_PASSWORD=$(oc get secret ${SRC_SECRET} \
            -n {{ .Values.oauthSecretExtraction.sourceSecret.namespace }} \
            -o jsonpath='{.data.{{ .Values.oauthSecretExtraction.sourceSecret.passwordKey }}}' | base64 -d)
          
          if [[ -z "$BIND_PASSWORD" ]]; then
            echo "❌ Failed to extract bindPassword from source secret"
            echo "Please verify the secret exists and contains key '{{ .Values.oauthSecretExtraction.sourceSecret.passwordKey }}'"
            exit 1
          fi
          
          echo "✅ Successfully extracted bindPassword (${#BIND_PASSWORD} characters)"
          
          # Create target namespace if it doesn't exist
          if ! oc get namespace {{ .Values.oauthSecretExtraction.targetSecret.namespace }} >/dev/null 2>&1; then
            echo "📁 Creating target namespace {{ .Values.oauthSecretExtraction.targetSecret.namespace }}"
            oc create namespace {{ .Values.oauthSecretExtraction.targetSecret.namespace }}
          fi
          
          # Create target secret with extracted password using dry-run + apply
          echo "🔑 Creating target secret with extracted password..."
          
          # Create the secret using oc create dry-run and then apply
          oc create secret generic {{ .Values.oauthSecretExtraction.targetSecret.name }} \
            --from-literal=username="$BIND_DN" \
            --from-literal=password="$BIND_PASSWORD" \
            -n {{ .Values.oauthSecretExtraction.targetSecret.namespace }} \
            --dry-run=client -o yaml | oc apply -f -
          
          echo "✅ Target secret created or updated successfully"
{{- if include "group-sync-operator-helm.needsCa" .Values.groupSync }}

          # ---- LDAP CA preflight --------------------------------------------------------
          # The url is ldaps:// or insecure is false, so the operator needs the CA that
          # groupSync.ca points at. Checked here because a missing one is not an install failure —
          # the operator just reconciles forever with "ConfigMap ... not found, caSecret must be
          # specified when insecure=false", which names neither the chart value nor the fix.
{{- if .Values.oauthSecretExtraction.caCopy.enabled }}
          # The source is the CA the cluster's OAuth LDAP identity provider already trusts, which
          # is copied into groupSync.namespace below so the operator needs no cross-namespace read.
          CA_KIND=ConfigMap
          CA_SRC={{ .Values.oauthSecretExtraction.caCopy.sourceCa.name }}
          CA_SRC_NS={{ .Values.oauthSecretExtraction.caCopy.sourceCa.namespace }}
          CA_SRC_KEY={{ .Values.oauthSecretExtraction.caCopy.sourceCa.key | default "ca.crt" }}
{{- if .Values.oauthSecretExtraction.caCopy.discoverFromOAuth }}

          # The OAuth CR is the authority on which ConfigMap holds that CA, so the name is read off
          # it rather than trusted from values. Only the name: the API fixes the namespace to
          # openshift-config and the key to ca.crt.
          echo
          echo "🔎 Reading the LDAP identity provider CA from the cluster OAuth CR"
          DISCOVERED=$(oc get oauth cluster \
            -o jsonpath='{range .spec.identityProviders[?(@.type=="LDAP")]}{.ldap.ca.name}{"\n"}{end}' \
            2>/dev/null | grep -v '^$' | head -1)

          if [[ -n "$DISCOVERED" ]]; then
            if [[ "$DISCOVERED" != "$CA_SRC" ]]; then
              echo "   OAuth CR names ${DISCOVERED}, values say ${CA_SRC} — using the OAuth CR"
            else
              echo "   OAuth CR names ${DISCOVERED}, matching values"
            fi
            CA_SRC="$DISCOVERED"
          else
            # Not an error: a cluster can sync groups from a directory it does not authenticate
            # against, and then no LDAP identity provider exists to discover from.
            IDPS=$(oc get oauth cluster \
              -o jsonpath='{range .spec.identityProviders[*]}{.name}={.type} {end}' 2>/dev/null)
            echo "   no LDAP identity provider in the OAuth CR (found: ${IDPS:-none})"
            echo "   using the configured source ${CA_SRC_NS}/${CA_SRC}"
          fi
{{- end }}
{{- else }}
          CA_KIND={{ include "group-sync-operator-helm.caKind" . }}
          CA_SRC={{ include "group-sync-operator-helm.caName" . }}
          CA_SRC_NS={{ include "group-sync-operator-helm.caNamespace" . }}
          CA_SRC_KEY={{ include "group-sync-operator-helm.caKey" . }}
{{- end }}
          CA_RES=$(echo "$CA_KIND" | tr '[:upper:]' '[:lower:]')

          echo
          echo "🔏 Checking LDAP CA: ${CA_RES}/${CA_SRC} in ${CA_SRC_NS}, key ${CA_SRC_KEY}"

          if ! oc get "$CA_RES" "$CA_SRC" -n "$CA_SRC_NS" >/dev/null 2>&1; then
            echo "❌ ${CA_KIND} ${CA_SRC} not found in ${CA_SRC_NS}"
            echo "   groupSync.url is ldaps:// or groupSync.insecure is false, so a CA is required."
            echo "   Either create it from your enterprise root CA:"
            echo "     oc create configmap ${CA_SRC} -n ${CA_SRC_NS} --from-file=${CA_SRC_KEY}=<root-ca.pem>"
            echo "   or point groupSync.ca at one that exists, or use ldap:// with insecure true."
            echo "   ${CA_KIND}s in ${CA_SRC_NS}:"
            oc get "$CA_RES" -n "$CA_SRC_NS" -o name 2>/dev/null | sed 's/^/     /'
            exit 1
          fi

          # oc extract, not jsonpath. The key contains a dot, and jsonpath treats it as a path
          # separator: both {.data.ca.crt} and {.data['ca.crt']} return empty on a resource that has
          # the key. Only {.data['ca\.crt']} works. extract takes the key literally, so any key name
          # is safe, and it reads Secrets and ConfigMaps alike.
          # Retried, because a ConfigMap can exist before it has contents. With
          # trustedCA.injected the chart ships it EMPTY and OpenShift's network operator fills
          # ca-bundle.crt moments later — reading once would fail the install on a race. Harmless for a
          # CA that is already populated: the first read succeeds and the loop exits.
          rm -rf /tmp/ca && mkdir -p /tmp/ca
          for attempt in $(seq 1 12); do
            oc extract "${CA_RES}/${CA_SRC}" -n "$CA_SRC_NS" \
              --keys="$CA_SRC_KEY" --to=/tmp/ca --confirm >/dev/null 2>&1
            [[ -s "/tmp/ca/${CA_SRC_KEY}" ]] && break
            [[ $attempt -eq 1 ]] && echo "   ${CA_SRC_KEY} not populated yet, waiting"
            sleep 5
          done

          # Checked on the file, not the exit code: a missing key exits 0 and writes nothing.
          if [[ ! -s "/tmp/ca/${CA_SRC_KEY}" ]]; then
            echo "❌ ${CA_SRC_NS}/${CA_SRC} has no '${CA_SRC_KEY}' key, or it is empty."
            echo "   Set groupSync.ca.key to one of:"
            rm -rf /tmp/ca-all && mkdir -p /tmp/ca-all
            oc extract "${CA_RES}/${CA_SRC}" -n "$CA_SRC_NS" --to=/tmp/ca-all --confirm >/dev/null 2>&1
            ls -1 /tmp/ca-all 2>/dev/null | sed 's/^/     /'
            exit 1
          fi

          # PEM, not an arbitrary blob: a wrong key would otherwise pass and fail later inside the
          # operator's TLS handshake, where the message names neither the key nor the resource.
          if ! grep -q 'BEGIN CERTIFICATE' "/tmp/ca/${CA_SRC_KEY}"; then
            echo "❌ ${CA_SRC_KEY} in ${CA_SRC_NS}/${CA_SRC} is not PEM (no BEGIN CERTIFICATE)"
            exit 1
          fi

          CA_COUNT=$(grep -c 'BEGIN CERTIFICATE' "/tmp/ca/${CA_SRC_KEY}")
          echo "✅ CA present: ${CA_COUNT} certificate(s) in ${CA_SRC_NS}/${CA_SRC} key ${CA_SRC_KEY}"
{{- if .Values.oauthSecretExtraction.caCopy.enabled }}

          # Copied into groupSync.namespace so the operator reads the CA from its own namespace.
          # Cross-namespace ConfigMap read is granted on some clusters and denied on others, and
          # where it is denied the operator just reconciles forever on "ConfigMap ... not found".
          CA_TGT={{ .Values.oauthSecretExtraction.caCopy.destinationCa.name }}
          CA_TGT_KEY={{ .Values.oauthSecretExtraction.caCopy.destinationCa.key | default "ca.crt" }}
          CA_TGT_NS={{ .Values.oauthSecretExtraction.caCopy.destinationCa.namespace | default .Values.groupSync.namespace }}
          CA_SRC_HASH={{ include "group-sync-operator-helm.caSourceHash" . }}
{{- if eq (.Values.oauthSecretExtraction.caCopy.destinationCa.kind | default "ConfigMap") "Secret" }}
          oc create secret generic "$CA_TGT" \
            --from-file="${CA_TGT_KEY}=/tmp/ca/${CA_SRC_KEY}" \
            -n "$CA_TGT_NS" \
            --dry-run=client -o yaml \
            | oc annotate --local -f - -o yaml \
                "group-sync.redhat-cop.io/source=${CA_SRC_NS}/${CA_SRC}" \
                "group-sync.redhat-cop.io/source-key=${CA_SRC_KEY}" \
                "group-sync.redhat-cop.io/source-hash=${CA_SRC_HASH}" \
            | oc apply -f - >/dev/null
          echo "✅ CA copied to secret ${CA_TGT_NS}/${CA_TGT} key ${CA_TGT_KEY}"
{{- else }}
          oc create configmap "$CA_TGT" \
            --from-file="${CA_TGT_KEY}=/tmp/ca/${CA_SRC_KEY}" \
            -n "$CA_TGT_NS" \
            --dry-run=client -o yaml \
            | oc annotate --local -f - -o yaml \
                "group-sync.redhat-cop.io/source=${CA_SRC_NS}/${CA_SRC}" \
                "group-sync.redhat-cop.io/source-key=${CA_SRC_KEY}" \
                "group-sync.redhat-cop.io/source-hash=${CA_SRC_HASH}" \
            | oc apply -f - >/dev/null
          echo "✅ CA copied to configmap ${CA_TGT_NS}/${CA_TGT} key ${CA_TGT_KEY}"
{{- end }}

          # groupSync.ca must name the copy, not the source — otherwise the copy is dead weight and
          # the operator still needs the cross-namespace read this exists to avoid.
          if [ "{{ include "group-sync-operator-helm.caName" . }}" != "$CA_TGT" ] \
          || [ "{{ include "group-sync-operator-helm.caNamespace" . }}" != "$CA_TGT_NS" ]; then
            echo "⚠️  groupSync.ca points at {{ include "group-sync-operator-helm.caNamespace" . }}/{{ include "group-sync-operator-helm.caName" . }}, not the copy."
            echo "    The operator will read the source directly and needs cross-namespace access."
            echo "    To use the copy, set:"
            echo "      groupSync.ca.kind: {{ .Values.oauthSecretExtraction.caCopy.destinationCa.kind | default "ConfigMap" }}"
            echo "      groupSync.ca.name: ${CA_TGT}"
            echo "      groupSync.ca.namespace: ${CA_TGT_NS}"
            echo "      groupSync.ca.key: ${CA_TGT_KEY}"
          fi
{{- end }}
          rm -rf /tmp/ca /tmp/ca-all
{{- end }}
          
          # Verification
          echo "🔍 Verifying created secret..."
          oc get secret {{ .Values.oauthSecretExtraction.targetSecret.name }} \
            -n {{ .Values.oauthSecretExtraction.targetSecret.namespace }}
          
          echo "📋 Secret contains keys:"
          if oc get secret {{ .Values.oauthSecretExtraction.targetSecret.name }} \
            -n {{ .Values.oauthSecretExtraction.targetSecret.namespace }} \
            -o jsonpath='{.data}' | jq -r 'keys[]' 2>/dev/null; then
            echo
          else
            echo "  - username"
            echo "  - password"
          fi
          
          echo
          echo "🎉 OAuth secret extraction completed successfully!"
          echo "📝 Summary:"
          echo "  ✓ Extracted password from ${SRC_SECRET}"
          echo "  ✓ Created {{ .Values.oauthSecretExtraction.targetSecret.name }} with username and password"
          echo "  ✓ GroupSync operator can now authenticate to LDAP"
        env:
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: {{ .Values.oauthSecretExtraction.resources.requests.cpu }}
            memory: {{ .Values.oauthSecretExtraction.resources.requests.memory }}
          limits:
            cpu: {{ .Values.oauthSecretExtraction.resources.limits.cpu }}
            memory: {{ .Values.oauthSecretExtraction.resources.limits.memory }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      # runAsNonRoot is deliberately NOT set. The image declares USER 0, so asserting it without a
      # runAsUser depends entirely on the SCC injecting one: restricted-v2 assigns a UID from the
      # namespace range and it works, but a RunAsAny SCC injects nothing and the kubelet refuses with
      # "container has runAsNonRoot and image will run as root". Pinning a runAsUser instead would
      # break restricted-v2, whose MustRunAsRange rejects any UID outside the namespace range — so the
      # SCC governs the user, and this keeps only the hardening that never conflicts.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
{{- end }}

