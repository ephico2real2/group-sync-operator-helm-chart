# CRC / local test directory over LDAPS, trusting the CA through OpenShift's trusted-CA injection
# instead of copying it.
#
# This mirrors how most enterprises are already set up: the corporate root sits in
# proxy/cluster.spec.trustedCA, a validator merges it with the system trust store into
# openshift-config-managed/trusted-ca-bundle, and every ConfigMap labelled
# config.openshift.io/inject-trusted-cabundle receives the result. Nothing to copy per namespace, and
# rotation is the cluster's problem rather than the chart's.
#
# The chart default is still the COPY (crc-values.yaml). This file is the injection variant.
#
# Prerequisites — the local root is not in any cluster's trust bundle, so it has to be put there:
#
#   setup-local-ldap-testing/15-bootstrap-cert-manager-ca.sh apply
#   setup-local-ldap-testing/15-bootstrap-cert-manager-ca.sh trust-cluster
#   setup-local-ldap-testing/30-manage-ldap-server.sh deploy
#   setup-local-ldap-testing/20-import-ldap-data.sh
#
#   helm install group-sync charts/group-sync-operator-helm -n group-sync-operator --create-namespace \
#     -f charts/group-sync-operator-helm/crc-injected-values.yaml
#   helm test group-sync -n group-sync-operator --logs
#
# On a real enterprise cluster, skip trust-cluster: the root is already in the proxy. Confirm with
#   oc get proxy cluster -o jsonpath='{.spec.trustedCA.name}{"\n"}'
# and if it is non-empty, this file works as-is against your own LDAP server url.
#
# Undo with: 15-bootstrap-cert-manager-ca.sh untrust-cluster

groupSync:
  url: "ldaps://openldap-service.ldap-testing.svc.cluster.local:636"


oauthSecretExtraction:
  bindDN: "cn=ocp-ldap-bind-serviceid,ou=TrustedApplications,dc=ephico2real,dc=com"
  sourceSecret:
    name: ldap-secret
  caCopy:
    # Nothing to copy: OpenShift populates the destination directly.
    enabled: false

# One switch. It resolves the CR's caSecret, the extraction Job's CA preflight, the RBAC that grants read
# on it, and both test pods — all to this ConfigMap with key ca-bundle.crt, which is what OpenShift's
# injector writes. It used to resolve none of them, so this file had to restate name/namespace/key/kind
# under groupSync.ca by hand; that is no longer necessary and has been removed.
trustedCA:
  injected:
    enabled: true
    name: ldap-trusted-ca

# The bda-rbac tenant, which this lab's directory carries and which used to arrive from the chart defaults.
# Declared here now that values.yaml ships customGroupSyncs.items empty — the lab states what it wants.
customGroupSyncs:
  enabled: true
  items:
    - name: bda-rbac-groupsync
      enabled: true
      groupCn: "bda-rbac-*"
      schedule: "0 * * * *"

# Operator pod sizing. Kept here as well as in values.yaml so this environment states what it wants rather
# than inheriting it — and 100m per container is what fits a single-node CRC, where the node runs the whole
# control plane and leaves only a few hundred millicores spare.
subscription:
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
