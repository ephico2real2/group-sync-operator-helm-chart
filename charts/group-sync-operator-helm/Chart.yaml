apiVersion: v2
name: group-sync-operator-helm
description: A Helm chart to deploy the GroupSync Operator and its configuration for LDAP synchronization in OpenShift
type: application
# 0.13.1, PATCH: adds test-discovery-values.yaml — crc-values.yaml WITHOUT groupSync.url, proving the
# hands-free url discovery still works end to end. Measured on CRC against the released 0.13.0: a full
# uninstall (CSV deleted) and reinstall with this file put the OAuth-CR-derived url
# (ldaps://openldap-service...:636, stripped to scheme://host:port) on all three live GroupSync CRs, the
# operator reached Succeeded, both helm test suites passed, and 66 Groups / 87 members were untouched. The
# file carries the requires-cluster marker because `lookup` reads the live cluster only — offline renders
# (helm template, client --dry-run, ArgoCD's repo-server) fail with the chart's own guard, which is the
# guard working, not discovery being broken. No template changed.
#
# 0.13.0, MINOR: THE CHART NO LONGER INSTALLS THE GroupSync CRD. crds/ is gone; OLM installs the CRD when
# the Subscription resolves, which is how every other operator in this estate is installed —
# cert-manager-venafi has no crds/ directory and no CustomResourceDefinition in its templates, and neither
# does the namespace-configuration operator's chart. Both verified, not assumed.
#
# WHY crds/ HAD TO GO. It solved the ordering problem and bought a worse one: two owners for one object.
# The directory is not templated, so no value in this chart could switch it off — `--skip-crds` is a flag
# the caller passes and `skipCrds` is a field the Application sets, neither a property of the chart. Helm
# never upgrades a CRD it installed from crds/, so the vendored file is a snapshot that drifts while the
# operator moves on. And under GitOps it was a live hazard: ArgoCD renders with `helm template
# --include-crds`, which emits crds/ where a plain `helm template` does not, so Argo took management of a
# CRD OLM already owned and — with prune and selfHeal — could delete or revert it. Deleting that CRD
# cascades to every GroupSync CR on the cluster.
#
# WHAT REPLACES IT: crd.install, default FALSE, rendering the same CRD as an ordinary template. It exists
# for one case only — a direct `helm install` onto a cluster without the operator, where Helm resolves
# every kind against API discovery BEFORE applying anything and the GroupSync CR at wave 3 fails on `no
# matches for kind "GroupSync"`. No hook weight or sync wave can reorder around that. ArgoCD never needs
# it: Argo applies wave by wave against a live cluster, so the Subscription at wave 0 has OLM install the
# CRD long before wave 3.
#
# THE REGRESSION THIS COULD HAVE SHIPPED, AND WHY IT DOES NOT. A file in crds/ is never deleted by `helm
# uninstall`; a templated resource is a release member and IS deleted, cascading to every GroupSync CR.
# The object therefore carries helm.sh/resource-policy: keep and argocd.argoproj.io/sync-options:
# Prune=false, so neither an uninstall nor flipping crd.install back to false can remove it. It also
# carries sync-wave -3, ahead of the namespace at -2, for the enabled-under-Argo case; Helm ignores that
# and sorts by kind, where CustomResourceDefinition already sorts first.
#
# Measured on this chart: --include-crds emits 0 CRDs at the default and 1 with crd.install=true; helm
# lint passes; the wave layout (namespace -2, OperatorGroup -1, Subscription 0) is the same one
# cert-manager-venafi uses.
#
# 0.13.0 ALSO FIXES THREE ARGOCD ORDERING DEFECTS, all invisible to `helm install` and therefore never seen
# on a cluster without ArgoCD. They were found by auditing the rendered manifest rather than the templates,
# and ci/check-ordering.py (ported from the sibling openshift-rbac-automation chart) now asserts all three
# so they cannot regress unnoticed — verified to catch each one when seeded back in.
#
#   1. THE INSTALLPLAN APPROVER DEADLOCKED A FIRST SYNC. It sat at sync-wave 1, one after the Subscription
#      at 0. ArgoCD advances only when a wave is HEALTHY, and its built-in health check for
#      operators.coreos.com/Subscription forgives InstallPlanPending/RequiresApproval only when
#      .status.installedCSV is already set — read from the check itself: when installedCSV is absent the
#      condition increments numPending, and numPending > 0 returns Progressing. On a first install
#      installedCSV is nil, so wave 0 never went healthy, wave 1 never started, and the Job that would
#      approve the plan was waiting on the wave waiting on it. installPlanApproval defaults to Manual, so
#      this was the DEFAULT path. An upgrade was always fine, which is why it hid. Now wave 0, matching
#      cert-manager-venafi, which documents this exact rule and which this chart had diverged from.
#
#   2. TWO JOBS RAN IN THE WRONG PHASE. The OAuth extraction and LDAP CA Jobs carried a sync-wave but no
#      argocd.argoproj.io/hook. ArgoCD does not ignore Helm hooks — per object, it uses the argocd
#      annotation if present and otherwise falls back to that object's helm.sh/hook, mapping post-install to
#      PostSync. Both therefore ran AFTER the whole sync rather than at wave 2, which put them after the
#      GroupSync CRs at wave 3 that consume the Secret and CA ConfigMap they create. Verified per-resource
#      in gitops-engine's hook.Types, not inferred from the docs, whose "all Helm hooks will be ignored"
#      wording reads application-wide. Both now carry hook: Sync like the other three Jobs.
#
#   3. THE GROUPSYNC CRs FAILED A FIRST SYNC AT DRY-RUN. ArgoCD dry-runs every resource BEFORE applying
#      anything, and a dry-run against a kind the cluster does not serve yet fails the WHOLE sync — and
#      since this release removed the CRD from the manifest, a first sync is exactly that shape: the CRD
#      arrives mid-sync, from OLM, at wave 0. Every CR (primary and customGroupSyncs) now carries
#      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true, ported verbatim from the
#      namespace-configuration-operator chart, whose policy CRs sit in the identical position. It does not
#      weaken validation once the CRD exists — ArgoCD still dry-runs when the kind is served — and it does
#      not help plain `helm install`, which is what crd.install is for.
#
# 0.12.13, PATCH: EVERY `oc` CALL NOW NAMES ITS RESOURCE IN FULL. Ported from the sibling
# openshift-rbac-automation chart, where the defect was measured rather than theorised:
#
#     Error from server (Forbidden): subscriptions.messaging.knative.dev "..." is forbidden:
#     ... cannot get resource "subscriptions" in API group "messaging.knative.dev"
#
# `oc get subscription` had bound to the WRONG API GROUP. A resource plural is not reserved — Knative
# Eventing serves `subscriptions`, OLM serves `subscriptions` — and which one a short name resolves to is
# decided by API discovery, so it changes as CRDs are installed and removed. These scripts run with
# HOME=/tmp and therefore a COLD discovery cache on every run, so the binding is not stable even between
# two runs of the same Job.
#
# 47 call sites qualified across the approver, the readiness wait, the provenance relabel, the two test
# scripts, NOTES.txt and the values files. THE ONES THAT MATTER MOST ARE THE LIST-DRIVEN DECISIONS in
# relabel-provenance.sh: `oc get groupsyncs...` decides which CRs are LIVE and `oc get groups...` decides
# which Groups carry a stale provenance value. A misrouted list returns NOTHING rather than failing, so
# either one would turn the repair into a silent no-op that reports success — and `groups` is a kind this
# chart WRITES to.
#
# ci/qualified-resources.py asserts it and is wired into CI. It checks the RENDER (so a script living in a
# ConfigMap value is covered like a file), the files/*.sh sources, and NOTES.txt plus the values files,
# because an operator copy-pastes those. No allowlist for "clusters where the short name is fine": a
# cluster can add a colliding CRD tomorrow.
#
# Verified as the ServiceAccounts that make the calls, on a live cluster: the relabel SA lists
# groupsyncs.redhatcop.redhat.io (3 live CRs) and lists/patches groups.user.openshift.io (64 of 66 Groups
# carry the provenance label); the approver SA reads subscriptions.operators.coreos.com; the wait SA reads
# both. Each is denied the verbs it does not need, so the scoping survived the rename.
version: 0.13.2
appVersion: "1.1"
home: https://github.com/ephico2real2/group-sync-operator-helm-chart
icon: https://raw.githubusercontent.com/redhat-cop/group-sync-operator/master/assets/logo.png
keywords:
  - openshift
  - ldap
  - group-sync
  - operator
maintainers:
  - name: ephico2real2
sources:
  - https://github.com/ephico2real2/group-sync-operator-helm-chart
  - https://github.com/redhat-cop/group-sync-operator
annotations:
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
  # 0.6.0 is a minor, not a patch: the CA copy becomes reachable in a configuration where it previously
  # could not run at all, and three behaviours change with it — the RBAC is reorganised (same effective
  # permissions, different Role objects), one unused cluster-scoped grant is dropped, and a render-time
  # guard now fires in a case it used to skip.
  #
  # Earlier entries are kept because Artifact Hub shows only the current release's list, and several of them
  # DID change behaviour — a suite that was always green can now fail, rfc2307 values that were silently
  # discarded now take effect, and trustedCA.injected now wins over a custom groupSync.ca.name. Anyone
  # moving from 0.3.x or 0.4.x still needs to read them.
  artifacthub.io/changes: |
    - kind: fixed
      description: "UNDER ARGOCD THE CREDENTIALS SECRET AND THE CA COPY WERE PRUNED SECONDS AFTER THE HOOK JOBS WROTE THEM. The Jobs stamped app.kubernetes.io/instance=<release> on the objects they create - Argo CD's resource-tracking label (the default method through Argo CD 2.x, which OpenShift GitOps 1.1x ships), and under Argo the release name IS the Application name - so the two objects carried the Application's ownership mark while being absent from the rendered manifest, and with automated prune Argo deleted them on the same sync. Measured 2026-09-18 on CRC with label tracking: written at 02:01:47, 'Pruned' at 02:01:48, absent at 02:01:57, the Application Synced/Healthy and every GroupSync on ReconcileError; and because the pruned objects are not in the manifest nothing is OutOfSync, so automated sync never re-ran the hooks. The release name now goes under group-sync-operator-helm/release, a key nothing tracks by; same sync at the fixed commit: 0 pruned rows, both objects present, all three GroupSyncs ReconcileSuccess. WHAT TO DO ON UPGRADE: nothing for Helm. Under Argo the version bump itself is the trigger: helm.sh/chart changes on every ordinary resource and three reclaim RBAC objects are new, so the Application goes OutOfSync and an automated sync runs the Sync hooks, which rewrite both objects (Argo keeps hooks in every sync, ApplyOutOfSyncOnly included). Only an Application whose NON-hook manifest is unchanged - two commits differing in hook Jobs alone, which is what was measured - stays Synced and needs one manual sync to re-run the hooks."
    - kind: added
      description: "csv-reclaim Job (helm weight -2, sync-wave 0), ported from cert-manager-venafi: clears the CSV a previous helm uninstall orphaned so a reinstall is one shot. Measured 2026-09-18: uninstall then install failed at the approver with 'constraints not satisfiable: @existing/group-sync-operator//group-sync-operator.v0.0.36', and because Helm stops at the first failed hook the OAuth extraction and CA copy never ran. One rule refined against this cluster: five seconds after an uninstall the orphan read Installing (OLM re-creating a component the release removed) and was Succeeded twelve seconds later, so an unsettled candidate is waited on inside the budget rather than dismissed. With it: orphan found at +7 s, deleted at +18 s, release deployed, no hand step. Renders only for Manual approval, like the approver."
    - kind: fixed
      description: "THE APPROVER WAITS THROUGH ResolutionFailed WHILE THE RECLAIM JOB IS ENABLED. Under Helm the reclaim runs first by weight; under Argo both sit at sync-wave 0 (the approver cannot leave the Subscription's wave, per 0.13.0) and Argo runs a wave's hooks concurrently, so the approver read ResolutionFailed and failed at once while the reclaim was still confirming the orphan - the install only recovered on Argo's retried sync. Now, with csvReclaim.enabled, ResolutionFailed is waited on inside the existing budget; the immediate failure and its remedy stay for the reclaim-disabled case and at the deadline."
    - kind: added
      description: "test-discovery-values.yaml: crc-values.yaml without groupSync.url, the hands-free discovery test. Installing with it proves the chart derives scheme://host:port from the cluster OAuth CR's LDAP identity provider via `lookup` - measured on CRC against released 0.13.0, where a full uninstall and reinstall with this file landed the derived url on all three live GroupSync CRs, the operator reached Succeeded, both test suites passed and 66 Groups were untouched. It carries the requires-cluster marker: lookup reads the LIVE cluster only, so the file can never render offline - helm template, client-side --dry-run and ArgoCD's repo-server all fail with the chart's own guard message, which is the guard working as designed rather than discovery being broken, and CI asserts exactly that failure. A GitOps values file must therefore always set groupSync.url; a direct helm install never needs to. No template changed in this release."
    - kind: fixed
      description: "EVERY GROUPSYNC CR NOW CARRIES argocd.argoproj.io/sync-options SkipDryRunOnMissingResource=true - without it the FIRST ArgoCD sync fails outright now that the CRD has left the manifest. ArgoCD dry-runs every resource before applying anything, and a dry-run against a kind the cluster does not serve yet fails with 'the server could not find the requested resource' - which fails the whole sync, not just that document. A first sync is exactly that shape since this release: the GroupSync CRD is not in the rendered source, it arrives mid-sync when OLM resolves the Subscription at wave 0, and the CRs sit at wave 3. Ported verbatim from the sibling namespace-configuration-operator chart, whose NamespaceConfig/GroupConfig policy CRs are in the identical position and have carried the identical annotation all along - this chart had simply not been aligned with it. The annotation does not weaken validation once the operator is installed (ArgoCD still dry-runs the document whenever the CRD is present, so a malformed spec is still caught before apply on every sync after the first), and it does not help plain `helm install`, which resolves kinds before applying and has no equivalent escape - that path is what crd.install exists for. Applied to the primary CR and to every customGroupSyncs item."
    - kind: added
      description: "ci/check-ordering.py, ported from the openshift-rbac-automation chart and wired into CI: asserts the install/uninstall ordering is DECLARED, not accidental. It renders the default values, every discoverable overlay, and crd.install=true, then requires an explicit sync-wave on every non-test resource (ArgoCD treats a missing wave as 0 - the Subscription's own wave - so an omission is an ordering bug that reads as fine), an explicit argocd.argoproj.io/hook on every Job in both the render and the template SOURCE (a gated template cannot hide from a source check), the approver sharing the Subscription's wave in the Sync phase, the readiness wait strictly between the Subscription and the CRs, every redhatcop.redhat.io CR above the Subscription's wave (ArgoCD deletes in reverse wave order, so teardown must remove CRs while the operator still runs their finalizers) and carrying SkipDryRunOnMissingResource, and no two same-event hooks sharing a helm hook-weight. Selectors are derived (CRs by API group, overlays by glob) rather than listed, and every selector asserts it matched something - including the test-fixture exemption itself. Verified to catch all three of this release's ordering defects when seeded back into a mutated copy of the chart."
    - kind: fixed
      description: "ARGOCD FIRST SYNC NO LONGER DEADLOCKS. The InstallPlan approver Job moves from sync-wave 1 to sync-wave 0, the Subscription's own wave. ArgoCD advances to the next wave only when the current one is healthy, and its built-in health check for operators.coreos.com/Subscription forgives InstallPlanPending/RequiresApproval only when .status.installedCSV is already set - when it is absent the same condition increments numPending, and numPending greater than zero returns Progressing. On a FIRST install installedCSV is nil, so wave 0 stayed Progressing, wave 1 never started, and the Job that would approve the InstallPlan was waiting on the wave that was waiting on it. The Application could never converge and the Application's retry limit could not help, because every attempt deadlocked identically. installPlanApproval defaults to Manual, so this was the default path, and an UPGRADE was always fine because installedCSV is already set - which is why it stayed hidden. Plain `helm install` was never affected: post-install hooks run after the manifest is applied, ordered by hook-weight alone with no wave gating, which is why this survived on a cluster with no ArgoCD. The sibling cert-manager-venafi chart places its approver at wave 0 and documents this rule; this chart had diverged from it."
    - kind: fixed
      description: "THE OAUTH EXTRACTION AND LDAP CA JOBS RAN IN THE WRONG ARGOCD PHASE. Both carried argocd.argoproj.io/sync-wave 2 but no argocd.argoproj.io/hook. ArgoCD does not ignore Helm hooks - for each object individually it uses the argocd annotation when present and otherwise falls back to that object's own helm.sh/hook, mapping post-install and post-upgrade to PostSync, which runs after the ENTIRE sync rather than at the object's wave. Their sync-wave therefore ordered them against nothing but other PostSync hooks. That inverted the ordering both Jobs exist to provide: the extraction Job writes the credentials Secret and the CA Job writes the trust ConfigMap that the GroupSync CRs at wave 3 read, so under ArgoCD the CRs came up pointing at objects that did not exist yet and the operator errored until it requeued. Both now carry hook Sync with BeforeHookCreation,HookSucceeded and Replace=true, matching the three Jobs that already had them. Confirmed per-resource against gitops-engine's hook.Types rather than inferred from the ArgoCD docs, whose 'if you define any Argo CD hooks, all Helm hooks will be ignored' wording reads application-wide but is per-object in the source. Note for anyone relying on hook-weight under ArgoCD: sync-wave takes precedence and the weight is only a fallback, so the CA Job's weight-6 ordering behind the extraction Job's weight-5 is a Helm-path guarantee only - safe here because the CA copy's default destination is the Application's own destination namespace, created by CreateNamespace before any wave runs."
    - kind: removed
      description: "BEHAVIOUR: the chart no longer installs the GroupSync CRD. crds/groupsyncs.redhatcop.redhat.io.yaml is gone and OLM installs the CRD when the Subscription at wave 0 resolves, which is how every other operator here is installed - cert-manager-venafi has no crds/ directory and no CustomResourceDefinition in its templates, and neither does the namespace-configuration operator's chart. Both verified. crds/ solved the ordering problem and bought a worse one: two owners for one object. It could not be switched off, because the directory is not templated and --skip-crds is a caller flag rather than a chart property; Helm never upgrades a CRD installed from crds/, so the vendored file drifts as the operator ships new versions; and under GitOps ArgoCD renders with `helm template --include-crds`, which emits crds/ where a plain `helm template` does not, so Argo managed a CRD OLM already owned and with prune plus selfHeal could delete or revert it - a deletion that cascades to every GroupSync CR on the cluster. WHAT TO DO ON UPGRADE: nothing, if OLM installed the CRD first. Check with `oc get crd groupsyncs.redhatcop.redhat.io -o jsonpath='{.metadata.annotations.argocd\\.argoproj\\.io/tracking-id}'` - empty means Argo never took it. Non-empty means Argo owns it: annotate the CRD Prune=false before upgrading."
    - kind: added
      description: "crd.install (default false) renders the same CRD as an ordinary template, for the one case that still needs it: a direct `helm install` onto a cluster where the operator is not yet present. Helm resolves every kind in the release against API discovery BEFORE it applies anything, so the GroupSync CR at wave 3 fails with `no matches for kind GroupSync` and nothing is applied - and no hook weight or sync wave can reorder around that, because the failure happens while Helm is still building the object list. Installing the operator first is the better answer. ArgoCD never needs it: Argo applies wave by wave against a live cluster, so the Subscription at wave 0 has OLM install the CRD long before wave 3. Moving out of crds/ would on its own have introduced a regression - a file in crds/ is never deleted by `helm uninstall` whereas a templated resource is, cascading to every GroupSync CR - so the object carries helm.sh/resource-policy keep and argocd.argoproj.io/sync-options Prune=false, meaning neither an uninstall nor flipping the value back to false can remove it. It also carries sync-wave -3, ahead of the namespace at -2, for the enabled-under-Argo case; Helm ignores that and sorts by kind, where CustomResourceDefinition already sorts first. Measured: --include-crds emits 0 CRDs at the default and 1 with crd.install=true. argocd-application.yaml keeps skipCrds true even though it is now a no-op, because targetRevision takes patches automatically and a rollback to a 0.12.x chart brings crds/ back."
    - kind: changed
      description: "sample-values.yaml is current again. Its commented tenant example named bda-rbac-groupsync, a CR this chart renamed to bdp-oud-group-rbac-groupsync in 0.12.1, and it claimed to be 'the same shape crc-values.yaml uses' - no longer true, so the example now uses a neutral analytics-rbac name rather than borrowing the lab's. It also said values.yaml ships customGroupSyncs.items EMPTY, which stopped being true when the login-gate item was added there disabled. And it now documents previousNames, which did not exist when the file was last touched: renaming an item renames its CR and every Group it synced keeps the old name in its sync-provider label, because the operator rewrites a Group only when that Group's LDAP membership changes. Measured on the reference lab, renaming the primary CR left 42 of 66 Groups stale until the provenance-relabel Job ran. Every key the file sets was checked against values.yaml - none had disappeared - and it still fails offline as its requires-cluster marker promises."
    - kind: added
      description: "Adds crc-example-values.yaml: crc-values.yaml with every comment stripped, so a reader can see a fully-configured install on one page rather than in 100+ annotated lines. Generated from crc-values.yaml and verified to render byte-identically - same values, same rendered manifest hash. It is NOT the file to copy for a new cluster and says so: the url, bindDN and group queries belong to one lab, and a chart pointed at someone else's directory silently syncs nothing. sample-values.yaml remains the starting point for a real cluster, because it sets only what the chart cannot discover. Also records why this file carries no '# requires-cluster: true' marker while sample-values.yaml does - it sets groupSync.url explicitly, so it renders offline, and CI asserts that."
    - kind: changed
      description: "Corrects a claim 0.12.9 made about autobahnusers-onboarding-groupsync: it is NOT a login gate, and its schedule is not login latency. OAuth checks membership itself - the identity provider's own LDAP query carries the (memberOf=cn=app-ssb-autobahnusers,...) filter, which OpenShift evaluates against the directory per user at login, with or without this CR. A person added in LDAP can authenticate immediately; the sync has no part in it. What the synced Group is instead: an audit record of who belongs to that LDAP group. It grants nothing - measured, zero RoleBindings or ClusterRoleBindings reference it, and its name carries none of the suffixes the NCO GroupConfig policies match, so no policy selects it either. The schedule buys freshness of that audit view, which is why two hours is cheap. No behaviour change in this release, only the comment."
    - kind: changed
      description: "crc-values.yaml sets autobahnusers-onboarding-groupsync to sync every two hours (0 */2 * * *) instead of inheriting the 30-minute primary schedule. The lab overlay only - no template or default change. Written as 0 */2 * * * and not */120 * * * *, because the minute field spans 0-59 so */120 never matches, which is the same trap the hourly item beside it already documents. WORTH KNOWING: this is the OAuth login-gate group, so the schedule IS login latency - somebody added to app-ssb-autobahnusers in LDAP cannot authenticate until the sync runs, and that wait is now up to two hours. Force a sync with setup-local-ldap-testing/60-force-groupsync.sh when onboarding someone who needs access immediately."
    - kind: changed
      description: "The relabel Job stops printing a NOTE for every already-satisfied rename, and checks instead of hedging. 0.12.6 made a zero-match mapping say 'already repaired, or the provider name changed' - true but useless, and it printed on EVERY routine upgrade: a steady-state run was 9 log lines of which 6 were notices about nothing happening, which is how a warning stops being a signal. The two cases are distinguishable, so the script now distinguishes them: a Group stranded by a PROVIDER rename still carries <old-cr>_<something>, so one prefix check answers it. Already repaired is now silent, because the closing line already says nothing was relabelled; a real provider rename now WARNS and names the stale values it found, telling the reader to relabel those by hand. Costs one extra list call, done once before the loop rather than per mapping. A label selector cannot match a prefix, so the filtering is client-side and the key's dots are escaped for jsonpath. Measured: steady state 6 lines and zero notices, a provider rename warns with the value named, and a normal repair is unchanged."
    - kind: changed
      description: "provenanceRelabel now pauses between every write instead of bursting in batches: pauseSeconds (1) replaces batchSize/batchPauseSeconds. A steady one-write-per-second is gentler on the API server than 20 back-to-back followed by a rest, and the arithmetic is easy - the run takes about a second per Group, so the 42-Group repair here takes ~41s. activeDeadlineSeconds goes 300 -> 1800 to match, and its comment now says it is sized to the WORK rather than to a wait: unlike the other Jobs in this chart it has no polling loop, so the only thing that makes it long-running is the number of Groups. At pauseSeconds 1 the deadline allows roughly 1,700 Groups against a largest-seen repair of 42, so it stays a backstop against a wedged run holding a hook open rather than a limit on legitimate work."
    - kind: changed
      description: "provenanceRelabel.limit now defaults to 0 (NO CAP), with retries and a batch pause instead. The cap was wrong from the start and 0.12.5's raise to 50 only postponed the problem. This Job's only write is `oc label --overwrite` on one key: it never removes the key, never deletes a Group, and never touches RBAC, because the GroupConfig policies match that key with operator: Exists and narrow by group name. The value is attribution metadata, so a wrong run mis-attributes Groups that were already credited to a CR which no longer exists, and the next correct run fixes it - nothing is lost that a re-run cannot restore. The cap was copied from the sibling chart's orphan sweeper, where it IS protective because that sweeper DELETES RoleBindings and a wrong run revokes access permanently. Here it only obstructed: renaming the primary CR needs 42 Groups relabelled, the cap refused at 25, and the upgrade hook failed with it. What replaces it is what a large run actually needs - provenanceRelabel.retries (3) with retryDelaySeconds (2) so one lost race with the operator does not leave the run half-applied, and batchSize (20) with batchPauseSeconds (2) so an uncapped repair does not hammer the API server. All five values are validated as whole numbers before anything runs, because a typo'd number that silently stops working while the run reports success is worse than no number."
    - kind: changed
      description: "provenanceRelabel.limit default 25 -> 50, because 25 refused a legitimate repair. Renaming the primary GroupSync in 0.12.4 orphaned 42 Groups, the cap aborted the hook at 25, and the helm upgrade failed with it - the CR renamed (a manifest resource) while the repair did not (a hook). The refusal was correct behaviour and the message said what to do, but a chart whose own documented rename fails on its own default is a bad default. The rule is now written down: pick it above the largest legitimate repair - a rename of whichever CR owns the most Groups, measured at 42 here - and below the number of labelled Groups, which is what a wrong or empty CR list would make look orphaned, 64 here. 50 sits between them, so 42 passes and 64 still aborts. The 42 was verified by hand before raising it: all 42 matched the renamed CR's own cn=app-ocp-rbac-* filter, so the count was explained rather than anomalous."
    - kind: changed
      description: "BEHAVIOUR: the primary GroupSync CR is renamed ldap-groupsync -> app-ocp-rbac-group-groupsync, named for what it actually syncs (its rfc2307 filter is cn=app-ocp-rbac-*). groupSync.previousNames declares the old name, so the provenance-relabel Job added in 0.12.2 repairs the Groups the rename orphans - on the reference cluster that CR owned 42 of 66 Groups, and without the declaration every one of them would keep sync-provider=ldap-groupsync_ldap forever, because the operator rewrites a Group only when its LDAP membership changes and a forced sync does not move it. WHAT THIS MEANS FOR AN EXISTING RELEASE: the upgrade deletes the old CR and creates the new one, the finalizer revokes nothing (Groups are not owned by the CR) and no Group is deleted, but the CR's own name changes - so anything naming it by hand needs updating. The runbook commands in README.md and the lab scripts under setup-local-ldap-testing/ were updated with it; the measurement logs in docs/VERIFY_sync_schedules.md, docs/PLAN_group_sync_dashboard.md and SYNC_LATENCY_TESTING.md were deliberately NOT, because each records an observation taken when the CR carried the old name and rewriting them would make them false. Set groupSync.name back to ldap-groupsync if you would rather keep it; nothing in the chart depends on the new string."
    - kind: added
      description: "Two values for installing a SELF-BUILT operator bundle or catalog instead of the published one, both defaulting to today's behaviour. operatorGroup.allNamespaces (default false) omits targetNamespaces entirely, which is how OLM expresses 'every namespace' - needed because `make bundle` from the operator's own config/manifests base declares ONLY the AllNamespaces install mode, while the published community bundle for v0.0.36 declares OwnNamespace/SingleNamespace, and a single-namespace OperatorGroup cannot install such a CSV. subscription.startingCSV (default empty) pins the exact CSV rather than taking the channel head; it was added because an overlay set it and the template SILENTLY IGNORED it, which is the class of defect this chart keeps removing. Also ships fork-catalog-values.yaml as a worked example overlay - inert unless passed with -f, and it names one person's registry, so replace those references before using it. docs/TESTING_A_FORK_OPERATOR_BUILD.md is the full procedure: build the image, package a bundle and a catalog, import the catalog into a running cluster so OLM installs it as it would a release, verify, and restore. It documents the traps too, each measured here: VERSION ?= 0.0.1 being older than the installed CSV so OLM never upgrades; InterOperatorGroupOwnerConflict because the CSV rather than the pod is the API provider, so scaling the old deployment to 0 does not clear it; a 2 GiB podman VM OOMing on msgraph-sdk-go with 'signal: killed'; and quay's 401-vs-404 distinction telling you whether a repo exists."
    - kind: added
      description: "provenanceRelabel repairs the sync-provider label on Groups whose GroupSync CR was RENAMED. The operator rewrites a Group only when that Group's LDAP membership changes, so a rename leaves every Group it synced carrying the old CR name - measured at 22 of 66 here, and a forced sync via 60-force-groupsync.sh did not move them. RBAC is unaffected (the GroupConfig policies match that label with Exists and narrow by group name), but the Groups are credited to no CR and their stale-group alert cannot fire. IT ONLY ACTS ON A DECLARED RENAME: write the old name in groupSync.previousNames or an item's previousNames and a post-install/post-upgrade hook Job at weight 7 corrects exactly those Groups - a reinstall repairs too, because Groups survive an uninstall. The mapping is never inferred - nothing on the cluster records that one CR succeeded another, and guessing it from LDAP filters would be acting on an ambiguous signal. Declare nothing and the feature renders NOTHING: no Job, no ServiceAccount, and no ClusterRole holding patch on groups. Safety properties, each verified against a stub oc across 10 scenarios: only oc label --overwrite and never a label removal, since dropping that key would revoke access; a Group whose old CR is still live is skipped rather than reassigned; the new value is built from the live CR's own provider names rather than assuming 'ldap'; every lookup aborts instead of reading an error as 'nothing to do'; and the ClusterRole carries `get` on groups because `oc label` issues a GET before its PATCH - measured with -v=6, and the sibling chart's missing-verb incident is what prompted checking; a non-numeric limit refuses to start; and provenanceRelabel.limit (default 25) aborts a run that would relabel more than that. dryRun reports every before -> after and changes nothing. The script ships as files/relabel-provenance.sh through a ConfigMap, so it can be read and run outside the cluster instead of being buried in a template."
    - kind: changed
      description: "crc-values.yaml renames its two custom GroupSync items to match what they actually sync: bda-rbac-groupsync -> bdp-oud-group-rbac-groupsync, which pairs with the NCO policy CR bdp-oud-group-rbac, and ldap-clusteraccess-groupsync -> autobahnusers-onboarding-groupsync, which syncs cn=app-ssb-autobahnusers. The lab overlay only - no template, default or behaviour change, and both items keep their filter and schedule. WORTH KNOWING BEFORE COPYING THIS: renaming an item renames its GroupSync CR, so Helm deletes the old one and creates the new one, and the groups it owned are NOT relabelled. Measured on both renames - 66 groups before and after with an identical list and nothing deleted, but 22 of them still carry sync-provider=<old-CR-name>_ldap, because the operator only rewrites a Group when its LDAP membership changes. A forced sync did not move them either. RBAC is unaffected, since the NCO GroupConfig policies select that label key with Exists and never its value - what breaks is attribution AND alerting - the dashboard rebuilds <crname>_<provider> and compares, so a mismatched value means the Group is credited to no CR and its stale-group alert cannot fire, and anything answering 'which sync owns this group' from the label value names a CR that no longer exists until the members change or the groups are recreated."
    - kind: added
      description: "subscription.resources sizes the OPERATOR's own pod, passed through to the Subscription's spec.config.resources. Empty by default, so nothing changes unless you set it - the operator keeps what its CSV declares, measured as manager requesting 300m/200Mi and kube-rbac-proxy requesting nothing, with no limits. requests and limits are independent, so raising requests while leaving limits unset (guaranteed share, free to burst, pod stays Burstable) is expressible. Three measured caveats are documented in values.yaml and echoed in NOTES.txt when the key is set: OLM applies one block to EVERY container so the scheduler sees double what you write; it REPLACES the CSV's sizing rather than merging; and a total too large for the node leaves the new pod Pending while the old one keeps serving and helm upgrade still reports success. A render-time guard refuses any key other than requests/limits/claims, because the API server prunes the rest silently - a singular 'request' would apply cleanly and do nothing."
    - kind: security
      description: "The InstallPlan approver is a namespaced Role instead of a ClusterRole. It granted patch on installplans in EVERY namespace - measured yes in default, kube-system and openshift-monitoring - and approving an InstallPlan installs an operator, so that was the broadest grant this chart held. All eight of its API calls are namespace-scoped, so nothing was lost. It also now grants clusterserviceversions get/list, without which csv_phase() returned empty on every call (measured: list clusterserviceversions -> no) leaving two diagnostic escape paths dead, and it no longer discards stderr, so a Forbidden stops looking like 'OLM staged nothing'."
    - kind: fixed
      description: "The extraction Job no longer attempts oc create namespace, which was never authorised: the rule granting it carried resourceNames, and RBAC does not honour those for create - a create request carries its name in the body, not the path. Measured: create namespaces -> no, so pointing targetSecret.namespace at a namespace that does not exist killed the Job on a bare Forbidden. It now says which namespace is missing and how to create it. The grant is not widened instead, because on a cluster-scoped resource an unpinned create means 'any namespace on this cluster'."
    - kind: changed
      description: "BEHAVIOUR: customGroupSyncs.items ships EMPTY. It carried an enabled bda-rbac-groupsync item, so a default install created a second GroupSync CR nobody asked for - on the reference cluster it owned 21 of 64 synced groups. If you relied on that default, declare the item in your own values file before upgrading; otherwise its CR disappears and the groups it owned stop being refreshed. They are not deleted, since prune runs during a sync and there is no longer a CR to sync."
    - kind: changed
      description: "BEHAVIOUR: the helm-test ClusterRole and ClusterRoleBinding are named <release>-<namespace>-test-role/-binding. Cluster-scoped names built from the release name alone collide when the same release name is used in two namespaces, which is the normal way to run this chart twice. Not the fullname helper: values.yaml pins fullnameOverride, which discards the release name and would collide harder."
    - kind: fixed
      description: "Six inert or misleading items: waitSeconds below 5 rendered ATTEMPTS=0 so every wait loop was skipped and the Job failed instantly blaming OLM for a values typo; the ownership guards that refuse to approve a plan this chart did not cause matched the subscription name unanchored, so a different package starting with the same string satisfied them; list was dropped from five name-pinned RBAC rules where RBAC ignores it; the documented oauthSecretExtraction.ttlSecondsAfterFinished was inert because both consumers carry the field as a comment; six comment-only annotations blocks rendered annotations: null; and sample-values.yaml (renamed from qa-values.yaml in this release) documented an install passing -f against a file that only exists inside the tarball."
    - kind: fixed
      description: "argocd-application.yaml sets RespectIgnoreDifferences=true and now ships the ignoreDifferences entry it needs. Without it, Argo saw a permanent diff on the injected-CA ConfigMap the chart deliberately ships empty and, with selfHeal, emptied it on every sync - breaking LDAPS verification until OpenShift refilled it. The chart stated the requirement in two places and satisfied it in none."
    - kind: fixed
      description: "CI's bare-chart-path check covers *.txt and *.sh and no longer relies on a character class a templated release name defeats, so it finally sees the five commands in NOTES.txt and two in the local-setup scripts that pointed at a directory with no Chart.yaml. The render-check list also no longer registers one assertion twice under two names, which reported 10 checks where there are 9."
    - kind: fixed
      description: "helm uninstall no longer leaves the credentials Secret and the CA copy behind. Both are written imperatively from inside hook Job containers, so they never appear in the stored release manifest and Helm has never known about them - measured on a real uninstall, the release went away and both objects stayed. A pre-delete hook Job now removes them by name, using delete verbs pinned to those two names; pre-delete because Helm runs it before deleting the release's own resources, so the ServiceAccount and Roles the Job needs still exist. The Jobs also now stamp both objects with the release's labels and the meta.helm.sh annotations, which makes them selectable by release and lets a later chart version adopt them - but note those annotations govern adoption only and do NOT cause deletion, which is why the pre-delete Job is the mechanism."
    - kind: fixed
      description: "The shipped argocd-application.yaml could never render. It pointed valueFiles at the chart's own values.yaml, where groupSync.url is empty, and ArgoCD's repo-server renders offline with helm template so the chart's lookup-based discovery of the url resolves to nothing - every GroupSync CR then hit a fail. It also set targetRevision: HEAD, which is a git ref and meaningless for a Helm chart source, where ArgoCD resolves targetRevision as a chart semver. It is now a two-source Application: the chart from the Helm repository pinned to 0.8.x, and the values file from your own git repository via $values, which must set groupSync.url explicitly. Needs ArgoCD 2.6 or newer."
    - kind: changed
      description: "BEHAVIOUR: operatorWait.waitSeconds and installPlanApprover.waitSeconds are now the TOTAL budget across their checks, which is what values.yaml has always documented. The retry count was computed once and reused by each loop, so every check got the full budget and the total could reach 3x the documented value - unreachable anyway, because activeDeadlineSeconds (waitSeconds + 120) killed the pod part-way with no message of its own. Both Jobs now take one wall-clock deadline before the first check. The effective ceiling drops from about waitSeconds + 120 to waitSeconds; raise the value if a slow cluster needs longer."
    - kind: fixed
      description: "README's Quick start offered a minimal values file for a directory the cluster does not authenticate against, without saying that exactly that scenario requires two objects to pre-exist in openshift-config: the bind password Secret, and the CA ConfigMap the caCopy source falls back to when there is no OAuth LDAP provider to discover one from. Both are now shown as oc create commands, with the sourceCa.name override that ties them together."
    - kind: fixed
      description: "README documented subscription.installPlanApproval as Automatic while values.yaml ships Manual - a documented default that inverted a real control, and one contradicted by README's own prose about the installplan-approver Job. The CI check that should have caught it matched only four value prefixes, so every subscription.*, installPlanApprover.*, operatorWait.* and customGroupSyncs.* row was invisible; it is now scoped by table header instead, raising coverage from 26 to 32 rows."
    - kind: changed
      description: "BEHAVIOUR: helm test now requires the credentials Secret to carry non-empty username and password keys, and fails naming them otherwise. Test 4 of the health check previously asserted key presence with `oc get -o jsonpath={.data.KEY} | base64 -d` and tested only that pipeline's exit status - which is 0 for a key that does not exist, since jsonpath prints nothing and base64 decodes nothing successfully. Measured on a live cluster it reported a key named definitely-not-a-key as present, so the first branch always won, the bindDN/bindPassword branch was unreachable, and a Secret with no username passed as valid with an empty bind DN. Both scripts also no longer accept bindDN/bindPassword as an alternative spelling: those are the OAuth identity provider's key names on its own Secret in openshift-config, which this chart does not own and the operator never reads. A suite that was green against such a Secret now fails."
    - kind: fixed
      description: "The three credential procedures in README.md and the credentialsSecret documentation in values.yaml named the keys bindDN and bindPassword. The operator reads only username and password (secretUsernameKey/secretPasswordKey), and getLdapCredentialValue returns an empty string for a missing key with no error - so following those procedures produced an anonymous bind rather than a failure. The docs now name the keys the operator actually reads, say which of the two Secrets this chart does not own, and no longer claim the read of the OAuth Secret is pinned to one name when sourceSecret.name is left empty."
    - kind: added
      description: "The LDAP CA preflight and copy moved into their own hook Job (01.6-ldap-ca-job.yaml), gated by whether there is CA work to do rather than by oauthSecretExtraction.enabled. A cluster with no OAuth LDAP identity provider to extract a bind password from can now still have its CA copied into the operator's namespace: set oauthSecretExtraction.enabled=false and leave caCopy.enabled=true."
    - kind: changed
      description: "BEHAVIOUR: oauthSecretExtraction.enabled=false no longer silently removes the CA copy, its preflight and its RBAC. caCopy.enabled read like a peer flag and behaved like a subordinate one - with extraction off the copy vanished while the GroupSync CR went on naming ca-config-map-copy, so the operator reconciled forever on an object nothing created. With extraction off the bind Secret is yours to create, with the keys username and password; NOTES.txt now says so, and warns when groupSync.ca still names the copy that no longer runs."
    - kind: fixed
      description: "A CA copy whose destination is outside the target Secret's namespace now survives an upgrade. Its Role granted create alone, while the Job writes with `oc create --dry-run=client | oc apply` and apply reads the object before patching it - so the first install succeeded and every upgrade after it failed on the read."
    - kind: security
      description: "The cluster-scoped get on oauths/cluster is now granted only to the Jobs that can actually reach `oc get oauth cluster`. It was granted whenever caCopy.discoverFromOAuth was set, which is about the CA rather than the credentials, so a cluster supplying both bindDN and sourceSecret.name and not copying a CA carried a cluster-scoped grant nothing used. The render check asserts both directions and is verified against the empty-bindDN case the previous rule existed to protect."
    - kind: changed
      description: "BEHAVIOUR: the guard refusing a CA copy written as one kind and read as another now fires with oauthSecretExtraction.enabled=false too. That combination previously rendered happily and produced a CR pointing at an object of the wrong kind that nothing creates."
    - kind: fixed
      description: "The ca-coherence render check no longer fails two legitimate installs. It asserted that a Job preflights the CA, which conflated 'a Job exists' with 'the CA is satisfied' - so trustedCA.injected, where the chart itself creates the ConfigMap, and a bring-your-own CA that predates the release were both reported broken."
    - kind: fixed
      description: "subscription.name now supplies both the Subscription object's name and its spec.name (the OLM package), from one value, so they cannot diverge. spec.name was hardcoded while the object name was templated, and both hook Jobs match CSV and Deployment names - which derive from the package - using subscription.name. Renaming it sent them waiting for a CSV that never appears."
    - kind: security
      description: "The extraction ServiceAccount no longer has create on secrets and configmaps in every namespace. RBAC ignores resourceNames for create so those rules could not be pinned by name; they are now Roles in the namespaces the Job actually writes to. Verified live: create secrets in default and kube-system are now denied, in the release namespace still allowed."
    - kind: changed
      description: "BEHAVIOUR: trustedCA.injected.enabled=true now resolves the CA for the GroupSync CR, the extraction Job's preflight, the RBAC that grants read on it, and both test pods - previously it only created a labelled empty ConfigMap that nothing read. If you set injected.enabled=true AND a custom groupSync.ca.name, the injected ConfigMap now wins where your name used to; unset injected.enabled to keep a custom CA."
    - kind: fixed
      description: "A CA copy written as one kind and read as another is now refused at render time. Setting only groupSync.ca.kind=Secret left the extraction Job creating a ConfigMap while the GroupSync CR asked for a Secret, so the operator looked for an object nobody created."
    - kind: fixed
      description: "A customGroupSyncs item with neither groupCn nor filter is now refused. It previously rendered the literal %!s(<nil>) into the CR's LDAP filter, which the operator uses verbatim - it matches nothing, and the only symptom is a tenant that syncs no groups."
    - kind: fixed
      description: "NOTES.txt's LDAP verification command pointed at ldapsearch in the operator image (which is distroless and has no shell utilities), read bindDN/bindPassword from a Secret that holds username/password, and printed the raw groupSync.url so a discovered url came out blank. It now points at helm test."
    - kind: fixed
      description: "helm test now verifies the endpoint the GroupSync CR actually uses. The test pods baked groupSync.url, so on a discovery-based install (empty url derived from the cluster OAuth CR) they received an empty url and the suite failed outright - the sample-values.yaml path could never pass."
    - kind: fixed
      description: The test pods default CA_KEY to ca.crt exactly as the CR does, so an emptied groupSync.ca.key no longer makes the suite report an unreadable CA on a ConfigMap that is fine.
    - kind: fixed
      description: The Role granting read on the discovered bind Secret is created in oauthSecretExtraction.sourceSecret.namespace instead of caCopy.sourceCa.namespace. They default to the same namespace, so this only mattered once they differed - then the extraction Job read a Secret nothing had granted it.
    - kind: security
      description: The helm test ServiceAccount no longer has cluster-wide get/list on secrets, configmaps, pods, namespaces and events. Reads are scoped to the release namespace, with secrets pinned to the credentials secret by name.
    - kind: changed
      description: "BEHAVIOUR: helm test can now fail. Both test scripts previously routed every failure through a counter and ended in an unconditional exit 0 - measured against a live cluster, 7 of 8 broken configurations reported success."
    - kind: changed
      description: "BEHAVIOUR: the seven rfc2307 attribute and error-tolerance settings under groupSync.rfc2307 are now honoured. They were declared in values.yaml but the template emitted fixed literals, so any override was silently discarded."
    - kind: fixed
      description: Whether a CA is needed is now decided from the resolved LDAP url rather than the raw values field, so a url discovered from the cluster OAuth CR no longer loses its caSecret when insecure is true.
    - kind: fixed
      description: The TLS check in ldap-connection-test.sh asserts success from curl's ssl_verify_result and time_appconnect instead of negating one exit code, which reported a verified chain for five of six failure modes.
    - kind: fixed
      description: Test 5 of the operator health check reads the CA with oc extract instead of jsonpath, which cannot address a key containing a dot and so reported a valid 149-certificate bundle as unreadable.
    - kind: fixed
      description: The OAuth read is granted whenever the extraction Job needs it, rather than only when a CA copy is also enabled.
    - kind: changed
      description: ArgoCD renders Helm sources with --include-crds, so crds/ IS part of an Application. argocd-application.yaml now sets skipCrds true to leave the GroupSync CRD owned by OLM. Adding it to an existing Application needs care - see the README, as prune can delete the CRD and cascade to every GroupSync CR.
