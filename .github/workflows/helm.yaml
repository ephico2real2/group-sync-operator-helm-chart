name: Release Charts

on:
  push:
    branches:
      - main
    # Only when the chart itself changes. A README or setup-script edit does not warrant a release run.
    #
    # chart-releaser also skips a version it has already published (skip_existing), so this is about not
    # running at all rather than about correctness — but it keeps the Actions history readable and means
    # a green run genuinely corresponds to a chart change.
    #
    # Anything NOT matched here still gets validated: ci.yaml has its own push-to-main trigger with no
    # path filter. The cost is that a push touching charts/ runs the checks twice — once standalone, once
    # as the gate below. They are offline and take seconds, and the alternative is a coverage gap.
    paths:
      - 'charts/**'

  # So a release can be forced without an empty commit — e.g. after bumping only Chart.yaml's version,
  # or to retry a run that failed on something transient.
  workflow_dispatch:

jobs:
  # The same checks that run on every PR, called rather than duplicated. Without this, a direct push to
  # main — or a merge landing while branch protection is off — would publish unvalidated.
  validate:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      # charts_dir defaults to `charts`, which is why the chart lives at
      # charts/group-sync-operator-helm. While it sat at the repo root this action found nothing to
      # package and published nothing.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_existing: true
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
