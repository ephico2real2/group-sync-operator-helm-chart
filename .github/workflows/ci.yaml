name: CI

# Runs on every PR, on every push to main, and — via workflow_call — as the gate in front of
# publishing. See .github/workflows/helm.yaml, which calls this and will not release unless it passes.
# That keeps the checks defined once, and means a release can never skip them even on a direct push.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

env:
  CHART: charts/group-sync-operator-helm

jobs:
  # Combinations, not just the shipped values files. Three real bugs reached main because CI rendered
  # only the four values files and the no-values case, and every one of those rendered fine:
  #
  #   the oauths RBAC rule was nested under two gates, so it vanished in configurations the Job still
  #   read the OAuth CR in; needsCa read the raw url, so an empty url with insecure:true emitted no CA
  #   even though the derived url was ldaps://; and the test pods baked .Values.groupSync.url, so a
  #   discovered url left them with an empty one and `helm test` could not pass at all.
  #
  # Each of those is a coherence property between two parts of the chart, which is what the assertions
  # in ci/render-checks.py test — and a render is only meaningful against values that make the two
  # parts disagree, hence the case list.
  render-matrix:
    name: Value combinations render coherently
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install --quiet pyyaml

      # Not a render. The url half of the bug above CANNOT be seen offline: the raw field and the
      # resolved url are the same string whenever a url is set, and offline a url must be set for
      # anything to render at all. So it is asserted on the template SOURCE — only the resolver may
      # read the raw field. Verified to produce 7 hits on the tree that had the bug, 0 on main.
      - name: Only the resolver may read the raw LDAP url
        run: python3 ci/url-guard.py "$CHART"

      - name: Render every combination and assert coherence
        run: |
          set -uo pipefail
          CHECKS="oauth-rbac source-secret-rbac ca-coherence ca-copy-kind oauth-cr-read test-env-matches-cr
                  no-cluster-wide-secret-read no-cluster-wide-credential-write olm-name-consistent no-artifacts"
          fails=0

          # must_render <label> -- <helm args...>
          must_render() {
            label="$1"; shift 2
            if ! helm template release "$CHART" "$@" > /tmp/r.yaml 2>/tmp/r.err; then
              echo "::error::[$label] expected a successful render, got:"
              tail -3 /tmp/r.err; fails=$((fails + 1)); return
            fi
            bad=0
            for c in $CHECKS; do
              if ! python3 ci/render-checks.py "$c" /tmp/r.yaml > /tmp/c.out 2>&1; then
                echo "::error::[$label] $c"; sed 's/^/    /' /tmp/c.out
                fails=$((fails + 1)); bad=$((bad + 1))
              fi
            done
            # Only claim ok when nothing failed — otherwise the summary line contradicts the errors
            # printed immediately above it, which is exactly how a red run gets skimmed as green.
            if [ "$bad" -eq 0 ]; then echo "  ok  $label"; else echo "  FAIL $label ($bad check(s))"; fi
          }

          # must_fail <label> <expected-substring> -- <helm args...>
          must_fail() {
            label="$1"; want="$2"; shift 3
            if helm template release "$CHART" "$@" > /tmp/r.yaml 2>/tmp/r.err; then
              echo "::error::[$label] rendered, but it must be refused: $want"
              fails=$((fails + 1)); return
            fi
            if ! grep -q "$want" /tmp/r.err; then
              echo "::error::[$label] failed, but not for the documented reason. Wanted: $want"
              tail -3 /tmp/r.err; fails=$((fails + 1)); return
            fi
            echo "  ok  $label  (refused as designed)"
          }

          URL=--set=groupSync.url=ldaps://ldap.example.com:636

          # The three regression guards. Each of these combinations rendered "fine" while broken.
          must_render "plain ldap, no CA copy, everything discovered" -- \
            --set groupSync.url=ldap://ldap.example.com:389 --set groupSync.insecure=true \
            --set oauthSecretExtraction.caCopy.enabled=false \
            --set oauthSecretExtraction.bindDN= --set oauthSecretExtraction.sourceSecret.name=
          must_render "ldaps with insecure=true still carries a CA" -- \
            "$URL" --set groupSync.insecure=true
          must_render "ca.key emptied — CR and test pods must agree" -- \
            "$URL" --set groupSync.ca.key=
          must_render "CA source in its own namespace" -- \
            "$URL" --set oauthSecretExtraction.caCopy.sourceCa.namespace=corp-trust \
            --set oauthSecretExtraction.sourceSecret.name=
          must_render "no GroupSync CR at all" -- \
            --set groupSync.enabled=false --set customGroupSyncs.enabled=false
          must_render "a CA copy written and read as a Secret" -- \
            "$URL" --set groupSync.ca.kind=Secret \
            --set oauthSecretExtraction.caCopy.destinationCa.kind=Secret
          must_render "a tenant with an explicit filter" -- \
            "$URL" --set-json 'customGroupSyncs.items=[{"name":"t","enabled":true,"filter":"(cn=x)"}]'
          # subscription.name IS the OLM package name, and supplies the Subscription object's name too.
          # They must never diverge: the CSV is "<package>.v<version>" and both hook Jobs match on it.
          must_render "subscription.name renamed, both names follow" -- \
            "$URL" --set subscription.name=some-mirrored-package

          # The CA copy and the credential extraction are separately gated. Not one case here ran with
          # oauthSecretExtraction.enabled=false before, which is how the two of them stayed welded together:
          # turning extraction off silently took the CA copy, its RBAC and its preflight with it, while the
          # CR went on naming a ConfigMap nothing created.
          must_render "CA copy without extraction (no OAuth LDAP provider)" -- \
            "$URL" --set oauthSecretExtraction.enabled=false
          must_render "extraction without the CA copy (BYO CA, still preflighted)" -- \
            "$URL" --set oauthSecretExtraction.caCopy.enabled=false
          must_render "neither: CA and credentials both supplied out of band" -- \
            "$URL" --set oauthSecretExtraction.enabled=false \
            --set oauthSecretExtraction.caCopy.enabled=false --set groupSync.ca.name=corp-root-ca
          must_render "injected CA with no extraction at all" -- \
            "$URL" --set oauthSecretExtraction.enabled=false --set trustedCA.injected.enabled=true
          # The copy's destination away from the target Secret: its Role used to grant create alone, so the
          # first install worked and every upgrade failed on the read that `oc apply` does before patching.
          must_render "CA copy into its own namespace" -- \
            "$URL" --set oauthSecretExtraction.caCopy.destinationCa.namespace=corp-trust \
            --set groupSync.ca.namespace=corp-trust

          # Incoherent inputs must be refused at render time, not silently mis-deployed.
          must_fail "CA written as ConfigMap, read as Secret" "reads it as a Secret" -- \
            "$URL" --set groupSync.ca.kind=Secret
          must_fail "tenant with neither groupCn nor filter" "neither groupCn nor filter" -- \
            "$URL" --set-json 'customGroupSyncs.items=[{"name":"t","enabled":true}]'
          must_fail "empty url must fail closed, even with insecure=true" \
            "no LDAP url could be derived" -- --set groupSync.insecure=true

          # And the shipped values files, through the same assertions.
          shopt -s nullglob
          for f in "$CHART"/*-values.yaml "$CHART"/environments/*.yaml; do
            grep -qE '^#\s*requires-cluster:\s*true' "$f" && continue
            must_render "values file $(basename "$f")" -- -f "$f"
          done

          echo
          if [ "$fails" -ne 0 ]; then echo "$fails assertion(s) failed"; exit 1; fi
          echo "all combinations coherent"

  # A chart change that does not bump the version publishes NOTHING, and the release run still goes
  # green — chart-releaser skips a version it has already published. That has cost this repo two
  # releases, one of them carrying a security fix. See docs/RELEASING.md.
  version-bump:
    name: Chart changes bump the chart version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A change under charts/ requires a new Chart.yaml version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          changed=$(git diff --name-only "$BASE" HEAD -- "$CHART" | grep -v '/Chart.yaml$' || true)
          if [ -z "$changed" ]; then
            echo "no chart content changed — nothing to publish, no bump needed"
            exit 0
          fi
          echo "chart content changed:"; printf '  %s\n' $changed

          was=$(git show "$BASE:$CHART/Chart.yaml" 2>/dev/null | awk '/^version:/{print $2; exit}')
          now=$(awk '/^version:/{print $2; exit}' "$CHART/Chart.yaml")
          echo "version: $was -> $now"

          if [ "$was" = "$now" ]; then
            echo "::error file=$CHART/Chart.yaml::chart content changed but version is still $now, so"
            echo "::error file=$CHART/Chart.yaml::chart-releaser will skip the release and report success"
            echo "::error file=$CHART/Chart.yaml::while publishing nothing. Bump it — see docs/RELEASING.md"
            exit 1
          fi
          echo "version was bumped"

  chart:
    name: Chart renders and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint "$CHART" -f "$CHART/crc-values.yaml"

      # Every values file must render — EXCEPT one that declares `# requires-cluster: true`, which
      # relies on values being derived from the cluster's OAuth CR via `lookup`. Those cannot render
      # offline by design, so they are asserted to fail for the documented reason instead of being
      # skipped. Skipping would let a genuine breakage hide behind the exemption.
      - name: Every values file renders (or fails for the documented reason)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$CHART"/*-values.yaml "$CHART"/environments/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no values files found under $CHART — did the chart move?"
            exit 1
          fi
          rendered=0; cluster=0
          for f in "${files[@]}"; do
            if grep -qE '^#\s*requires-cluster:\s*true' "$f"; then
              if out=$(helm template release "$CHART" -f "$f" 2>&1); then
                echo "::error file=$f::declares requires-cluster but rendered offline — either the"
                echo "::error file=$f::marker is stale, or a value it relies on regained a default"
                exit 1
              fi
              if ! grep -q 'no LDAP url could be derived' <<<"$out"; then
                echo "::error file=$f::failed, but not for the documented reason:"
                printf '%s\n' "$out" | tail -5
                exit 1
              fi
              echo "--- $f  needs a cluster, fails as documented"
              cluster=$((cluster + 1))
            else
              helm template release "$CHART" -f "$f" > /dev/null
              echo "--- $f  renders"
              rendered=$((rendered + 1))
            fi
          done
          echo "$rendered values file(s) rendered, $cluster requiring a live cluster"

      # Pins a deliberate contract: groupSync.url is empty in the base values so each cluster supplies
      # it or it is derived from the OAuth CR at install time. `helm template` cannot read a cluster, so
      # rendering with no values file MUST fail — with that specific message, not some later accident.
      - name: Base values alone must fail, by design
        run: |
          set -uo pipefail
          if out=$(helm template release "$CHART" 2>&1); then
            echo "::error::rendering with no values file SUCCEEDED — groupSync.url has regained a default"
            exit 1
          fi
          if ! grep -q 'no LDAP url could be derived' <<<"$out"; then
            echo "::error::it failed, but not for the documented reason:"
            printf '%s\n' "$out" | tail -5
            exit 1
          fi
          echo "fails as documented"

  test-scripts:
    name: Test scripts are actually shipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # THE check this repo most needs. .helmignore once listed the directory these are loaded from, so
      # .Files.Get returned empty, both scripts shipped as 0 BYTES, and `helm test` passed every suite
      # without executing a line — while the LDAP directory was in CrashLoopBackOff. Nothing was red.
      #
      # .Files.Get resolves relative to the CHART directory, so this also fails if files/ is ever moved
      # outside it or caught by a new .helmignore pattern.
      - name: ConfigMap data is non-empty
        run: |
          set -euo pipefail
          helm template release "$CHART" -f "$CHART/crc-values.yaml" > /tmp/rendered.yaml
          python3 - <<'PY'
          import sys, yaml
          found = {}
          for d in yaml.safe_load_all(open('/tmp/rendered.yaml')):
              if d and d.get('kind') == 'ConfigMap' and 'test-scripts' in d['metadata']['name']:
                  found = d.get('data') or {}
          if not found:
              print("::error::no test-scripts ConfigMap rendered, or it has no data")
              sys.exit(1)
          bad = [k for k, v in found.items() if len(v) < 500]
          for k, v in sorted(found.items()):
              print(f"  {k}: {len(v)} bytes")
          if bad:
              print(f"::error::shipped empty or truncated: {bad}. .Files.Get is not finding them — "
                    f"check .helmignore and that files/ is inside the chart directory.")
              sys.exit(1)
          print(f"{len(found)} script(s) shipped with content")
          PY

      # A syntax error in a templated shell script only shows up when the pod runs, which in a hook is
      # after the install has half-completed. Caught here instead.
      - name: Shell syntax — source scripts and rendered job scripts
        run: |
          set -euo pipefail
          for f in "$CHART"/files/*.sh; do
            bash -n "$f" && echo "  ok  $f"
          done
          python3 - <<'PY' > /tmp/scripts.txt
          import yaml
          out = []
          for d in yaml.safe_load_all(open('/tmp/rendered.yaml')):
              if not d: continue
              spec = None
              if d.get('kind') == 'Job':   spec = d['spec']['template']['spec']
              elif d.get('kind') == 'Pod': spec = d['spec']
              if not spec: continue
              for c in spec.get('initContainers', []) + spec['containers']:
                  cmd = c.get('command') or []
                  if len(cmd) >= 3 and cmd[0].endswith(('bash', 'sh')):
                      out.append((d['metadata']['name'], c['name'], cmd[-1]))
          for name, ctr, body in out:
              open(f"/tmp/{name}--{ctr}.sh", "w").write(body)
              print(f"{name}--{ctr}.sh")
          PY
          while read -r s; do
            bash -n "/tmp/$s" && echo "  ok  rendered: $s"
          done < /tmp/scripts.txt

  docs:
    name: Docs match the chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Found six wrong rows when first run by hand, including test.openldapClientImage.* — a parameter
      # that did not exist at all, so anyone setting it would have been silently ignored.
      - name: README parameter tables match values.yaml
        run: |
          python3 - <<'PY'
          import re, sys, pathlib, yaml, os
          chart = os.environ['CHART']
          values = yaml.safe_load(open(f"{chart}/values.yaml"))

          def dig(path):
              cur = values
              for key in path.split('.'):
                  if not isinstance(cur, dict) or key not in cur:
                      return None
                  cur = cur[key]
              return cur

          rows = re.findall(
              r'^\| ((?:groupSync|oauthSecretExtraction|test|trustedCA)\.[\w.]+) \|[^|]*\| ([^|]+)\|',
              pathlib.Path('README.md').read_text(), re.M)
          if not rows:
              print("::error::no parameter rows found in README.md — did the table format change?")
              sys.exit(1)

          bad = 0
          for param, documented in rows:
              actual = dig(param)
              documented = documented.strip().strip('`').strip('"')
              if actual is None:
                  print(f"::error file=README.md::{param} does not exist in values.yaml")
                  bad += 1
              elif str(actual).lower() != documented.lower() and documented.lower() not in str(actual).lower():
                  print(f"::error file=README.md::{param}: README says '{documented}', values.yaml has '{actual}'")
                  bad += 1
          print(f"{len(rows)} documented parameters checked, {bad} mismatched")
          sys.exit(1 if bad else 0)
          PY

      # Chart paths in docs broke when the chart moved into charts/. A bare `.` or `..` now resolves to
      # a directory with no Chart.yaml, so the command in the docs simply does not work.
      - name: No bare chart paths in documented helm commands
        run: |
          set -uo pipefail
          hits=$(grep -rnE 'helm (install|upgrade|template|lint) [a-z0-9-]* ?(\.|\.\.)([[:space:]]|\\|$)' \
                   --include='*.md' --include='*.yaml' . \
                   | grep -v '^\./\.git' || true)
          if [ -n "$hits" ]; then
            echo "::error::helm commands with a bare . or .. chart path — they no longer resolve to a chart:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "all documented helm commands use an explicit chart path"
